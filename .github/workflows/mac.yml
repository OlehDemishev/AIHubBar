# The Mac app's unit tests and string catalog on every PR that touches them (docs/specs/SPEC-refactor.md §7). The repository
# is public, so GitHub's macOS machines cost nothing here. Locally the same: scripts/check.sh.
name: Mac

on:
  pull_request:
    paths:
      - "AIHubBar/**"
      - "AIHubBarTests/**"
      - "AIHubBarWidget/**"
      - "project.yml"
      - "scripts/check.sh"
      - "scripts/strings-check.py"
      - "desktop/scripts/strings.py"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths:
      - "AIHubBar/**"
      - "AIHubBarTests/**"
      - "AIHubBarWidget/**"
      - "project.yml"
      - "scripts/check.sh"
      - "scripts/strings-check.py"
      - "desktop/scripts/strings.py"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strings:
    name: String catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/strings-check.py

  test:
    name: Mac tests
    # The same Xcode releases are built with (docs/RELEASE.md), so what passes here also compiles there. GitHub calls this
    # image a preview: it can queue longer.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Check
        # Everything a push needs, the same as locally: strings, the relay's tests, the Mac tests.
        run: scripts/check.sh
