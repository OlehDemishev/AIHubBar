# AI Hub Bar for Windows and Linux (desktop/, docs/specs/SPEC-windows.md, docs/specs/SPEC-linux.md).
# The repository is public, so GitHub's Windows and Linux machines cost nothing: they test the Rust code and build
# the installers that can't be built on the Mac. The Mac app (Xcode) is not built here.
name: Desktop

on:
  # Not on the Mac string catalog while Windows/Linux are postponed (Oleh, 2026-11-02): scripts/check.sh still checks
  # the desktop texts locally. Put "AIHubBar/Resources/Localizable.xcstrings" back here when the work resumes.
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  strings:
    name: Texts match the Mac catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/strings.py --check

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.os }})
    needs: [strings, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            cli: target/release/claudepult.exe
          - os: ubuntu-22.04
            bundles: deb
            cli: target/release/claudepult
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # claudepult-hook and claudepult go into the installer next to the app (externalBin).
      - run: cargo build --release --locked -p claudepult-hook -p claudepult-cli
      - run: ./scripts/stage-binaries.sh
        shell: bash
      - run: npx tauri build --bundles ${{ matrix.bundles }} --config app/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-hub-bar-${{ runner.os }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
            desktop/${{ matrix.cli }}
          if-no-files-found: error
          retention-days: 14
