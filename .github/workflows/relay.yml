# The shared Telegram bot's relay (relay/telegram, docs/specs/SPEC-telegram.md §7): its logic tests under Node.
# Deploying stays a manual step (relay/telegram/README.md).
name: Relay

on:
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"

permissions:
  contents: read

jobs:
  test:
    name: Relay tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay/telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
