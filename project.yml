name: ClaudePult

options:
  bundleIdPrefix: com.demishev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  ClaudePult:
    type: application
    platform: macOS
    sources:
      - path: ClaudePult
    info:
      path: ClaudePult/Info.plist
      properties:
        CFBundleDisplayName: ClaudePult
        CFBundleName: ClaudePult
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© Oleh Demishev"
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en, es]
        NSAppleEventsUsageDescription: "ClaudePult открывает окна Терминала и запускает в них Claude Code для ваших проектов."
        # *.claudepult — exported settings and modes (SPEC-modes §12).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.demishev.claudepult.settings
            UTTypeDescription: Настройки ClaudePult
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [claudepult]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Настройки ClaudePult
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.demishev.claudepult.settings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demishev.claudepult
        PRODUCT_NAME: ClaudePult
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClaudePultWidget

  # Desktop / Notification Center widget: subscription limits from usage.json.
  ClaudePultWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ClaudePultWidget
    info:
      path: ClaudePultWidget/Info.plist
      properties:
        CFBundleDisplayName: ClaudePult
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ClaudePultWidget/ClaudePultWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Widgets must be sandboxed; this read-only exception lets the widget read usage.json without an
        # App Group (which needs a signing team; the project is signed ad-hoc).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/ClaudePult/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demishev.claudepult.widget
        PRODUCT_NAME: ClaudePultWidget
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  ClaudePultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudePultTests
    dependencies:
      - target: ClaudePult
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demishev.claudepult.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudePult.app/Contents/MacOS/ClaudePult
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ClaudePult:
    build:
      targets:
        ClaudePult: all
        ClaudePultTests: [test]
    test:
      targets:
        - ClaudePultTests
