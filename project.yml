name: ClaudePult

options:
  bundleIdPrefix: com.demishev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ClaudePult:
    type: application
    platform: macOS
    sources:
      - path: ClaudePult
    info:
      path: ClaudePult/Info.plist
      properties:
        CFBundleDisplayName: ClaudePult
        CFBundleName: ClaudePult
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© Oleh Demishev"
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        NSAppleEventsUsageDescription: "ClaudePult открывает окна Терминала и запускает в них Claude Code для ваших проектов."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demishev.claudepult
        PRODUCT_NAME: ClaudePult
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClaudePultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudePultTests
    dependencies:
      - target: ClaudePult
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demishev.claudepult.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudePult.app/Contents/MacOS/ClaudePult
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ClaudePult:
    build:
      targets:
        ClaudePult: all
        ClaudePultTests: [test]
    test:
      targets:
        - ClaudePultTests
