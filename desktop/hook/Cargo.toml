[package]
name = "claudepult-hook"
description = "Claude Code hook of AI Hub Bar: records session state for the tray app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "claudepult-hook"
path = "src/main.rs"

[dependencies]
claudepult-core.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
