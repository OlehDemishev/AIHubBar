[package]
name = "skill-catalog"
description = "The local catalog of Agent Skills: what is installed for every agent, with the scanner's verdicts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skill-scanner.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# SQLite built into the program (no system library on Windows), with FTS5 for the search.
rusqlite = { version = "0.37", features = ["bundled"] }
# The Anthropic API for the optional LLM review; already built for claudepult-core.
ureq = "3"
