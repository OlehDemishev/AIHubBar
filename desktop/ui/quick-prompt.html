<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Hub Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="quick-prompt-window">
  <header class="quick-prompt-head">
    <h1 data-t="Быстрый запрос"></h1>
    <span class="spacer"></span>
    <button class="icon-button" id="settings" data-t-title="Настройки быстрого запроса" aria-label="⚙">⚙</button>
  </header>
  <textarea id="task" rows="4" data-t-placeholder="Что сделать?"></textarea>
  <div class="qp-files" id="files"></div>
  <p class="secondary" id="no-projects" data-t="Нет git-проектов: укажите папку с проектами в профиле — Настройки → «Профили»." hidden></p>
  <div class="quick-prompt-row">
    <label><span data-t="Проект"></span> <select id="project"></select></label>
    <label><span data-t="Агент"></span> <select id="agent"></select></label>
  </div>
  <div class="quick-prompt-row">
    <span class="segmented" id="modes">
      <button id="mode-background" data-t="Фон"></button>
      <button id="mode-terminal" data-t="Терминал"></button>
    </span>
    <span class="spacer"></span>
    <button id="cancel" data-t="Отмена"></button>
    <button class="prominent" id="send" data-t="Запустить"></button>
  </div>
  <p class="secondary qp-hint" id="hint"></p>
  <div class="launch-message" id="answer" hidden>
    <span id="answer-text"></span>
    <button class="small" id="again" data-t="Запустить всё равно" hidden></button>
  </div>
  <script type="module">
    // «Быстрый запрос»: Ctrl+Enter sends, Esc closes; the window closes by itself once the task is on its way.
    import { loadTexts, invoke, t } from "./app.js";
    await loadTexts();
    const task = document.getElementById("task");
    const project = document.getElementById("project");
    const agent = document.getElementById("agent");
    let start = null;
    let mode = "background";
    let sending = false;
    // Files dropped on the window: their paths go to the agent with the task (the Mac's «Файлы и снимки экрана»).
    let files = [];
    function showFiles() {
      const box = document.getElementById("files");
      if (files.length === 0) {
        box.replaceChildren(Object.assign(document.createElement("p"), { className: "secondary qp-drop", textContent: t("Файлы и снимки экрана можно перетащить в это окно — агент получит их пути.") }));
        return;
      }
      box.replaceChildren(...files.map((path) => {
        const row = document.createElement("div");
        row.className = "qp-file";
        const name = Object.assign(document.createElement("span"), { textContent: "📎 " + path.split(/[\\/]/).pop(), title: path });
        const remove = Object.assign(document.createElement("button"), { className: "icon-button", textContent: "✕", title: t("Убрать файл") });
        remove.setAttribute("aria-label", t("Убрать файл"));
        remove.onclick = () => { files = files.filter((f) => f !== path); showFiles(); };
        row.append(name, remove);
        return row;
      }));
    }
    window.__TAURI__.event.listen("tauri://drag-drop", (event) => {
      const dropped = event.payload?.paths ?? [];
      for (const path of dropped) if (!files.includes(path) && files.length < 8) files.push(path);
      showFiles();
    });

    const hints = {
      "claude-code": t("Фон — claude -p без окна, итог уведомлением; Терминал — новое окно, можно отвечать Claude"),
      codex: t("Фон — codex exec без окна, итог уведомлением; Терминал — задача в буфере обмена, вставьте Ctrl+V"),
    };
    const chosen = () => start.agents.find((a) => a.id === agent.value) ?? start.agents[0];
    function showModes() {
      const allowed = chosen().modes;
      if (!allowed.includes(mode)) mode = allowed[0];
      for (const id of ["background", "terminal"]) {
        const button = document.getElementById(`mode-${id}`);
        button.hidden = !allowed.includes(id);
        button.classList.toggle("pressed", id === mode);
      }
      document.getElementById("hint").textContent = hints[chosen().id] ?? t("Другие агенты — только в Терминале: задача в буфере обмена, вставьте Ctrl+V");
      showSend();
    }
    function showSend() {
      document.getElementById("send").disabled = sending || !task.value.trim() || !project.value;
    }
    function answer(text, error = false, confirm = false) {
      const box = document.getElementById("answer");
      box.hidden = !text;
      box.classList.toggle("error", error);
      document.getElementById("answer-text").textContent = text ?? "";
      document.getElementById("again").hidden = !confirm;
    }

    // A new request: empty text, Claude Code, the project in front (or the last one).
    async function reset() {
      start = await invoke("quick_prompt_start");
      task.value = "";
      files = [];
      showFiles();
      sending = false;
      answer(null);
      project.replaceChildren(...start.projects.map((p) => new Option(p.name, p.id)));
      project.value = start.project ?? start.projects[0]?.id ?? "";
      project.disabled = start.projects.length === 0;
      document.getElementById("no-projects").hidden = start.projects.length > 0;
      agent.replaceChildren(...start.agents.map((a) => new Option(a.name, a.id)));
      agent.value = "claude-code";
      mode = chosen().startMode;
      showModes();
      task.focus();
    }

    async function send(allowBusy = false) {
      if (document.getElementById("send").disabled && !allowBusy) return;
      sending = true;
      showSend();
      answer(null);
      const reply = await invoke("quick_prompt_send", { text: task.value, project: project.value, agent: agent.value, mode, allowBusy, files });
      sending = false;
      showSend();
      if (reply.close) {
        // Long enough to read where the task went (a terminal agent's clipboard note), then gone.
        answer(reply.message);
        setTimeout(() => invoke("close_quick_prompt"), reply.linger ? 3500 : 900);
        return;
      }
      answer(reply.message, reply.error, reply.confirm);
    }

    agent.onchange = () => { mode = chosen().startMode; showModes(); };
    project.onchange = showSend;
    task.oninput = showSend;
    for (const id of ["background", "terminal"]) document.getElementById(`mode-${id}`).onclick = () => { mode = id; showModes(); };
    document.getElementById("send").onclick = () => send();
    document.getElementById("again").onclick = () => send(true);
    document.getElementById("cancel").onclick = () => invoke("close_quick_prompt");
    document.getElementById("settings").onclick = async () => { await invoke("open_settings", { page: "module.quickPrompt" }); invoke("close_quick_prompt"); };
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") invoke("close_quick_prompt");
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); send(); }
    });
    window.__TAURI__.event.listen("quick-prompt-opened", reset);
    await reset();
  </script>
</body>
</html>
