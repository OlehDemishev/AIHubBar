<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Hub Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>
      <h1>AI Hub Bar</h1>
      <select id="profile-switch" data-t-title="Сменить профиль" hidden></select>
      <span class="spacer"></span>
      <button class="icon-button" id="refresh" data-t-title="Обновить" aria-label="Refresh">↻</button>
      <button class="icon-button" id="help" data-t-title="Открыть справку" aria-label="Help">?</button>
      <button class="icon-button" id="settings" data-t-title="Настройки…" aria-label="Settings">⚙</button>
      <button class="icon-button" id="quit" data-t-title="Выйти из AI Hub Bar" aria-label="Quit">⏻</button>
    </header>
    <div class="search" id="search">
      <span class="glass" aria-hidden="true">🔍</span>
      <input type="text" id="search-field" autocomplete="off" spellcheck="false" data-t-placeholder="Найти проект, сессию, команду…">
      <button class="icon-button" id="search-clear" data-t-title="Очистить поиск (Esc)" hidden>✕</button>
    </div>
    <section class="card search-results" id="search-results" hidden></section>
    <section class="card whats-new" id="whats-new" hidden>
      <h2><span aria-hidden="true">✨</span> <span data-t="Что нового"></span></h2>
      <ul id="whats-new-items"></ul>
      <p class="buttons">
        <span class="spacer"></span>
        <button class="small" id="whats-new-settings" data-t="Открыть настройки"></button>
        <button class="small prominent" id="whats-new-done" data-t="Понятно"></button>
      </p>
    </section>
    <section class="card hint" id="tray-hint" hidden>
      <p data-t="Windows прячет новые значки под «^». Чтобы AI Hub Bar был всегда виден: Параметры → Персонализация → Панель задач → Другие значки на панели задач."></p>
      <p style="margin-top: 8px"><button id="tray-hint-done" data-t="Готово"></button></p>
    </section>
    <section class="card create-profile" id="create-profile" hidden>
      <h2 data-t="Создайте первый профиль"></h2>
      <p class="secondary" data-t="Профиль — это то, что будет в панели: лимиты AI, сессии, проекты с командами, календарь. Помощник соберёт его за пару минут."></p>
      <p class="buttons">
        <button class="prominent" id="create-assistant" data-t="Помощник…"></button>
        <button id="create-import" data-t="Импортировать файл…"></button>
      </p>
      <p class="error" id="create-error" hidden></p>
    </section>
    <section class="card limits" aria-live="polite">
      <h2 data-t="Лимиты"></h2>
      <div class="rings" id="rings"></div>
      <div id="others"></div>
      <p class="secondary" id="forecast" hidden></p>
      <div class="hub" id="hub" hidden>
        <h3 data-t="Другие AI"></h3>
        <div id="hub-rows"></div>
      </div>
      <p class="error" id="limits-error" hidden></p>
      <p class="outage" id="limits-outage" hidden><span id="limits-outage-text"></span> <button class="link" id="limits-outage-more" data-t="Подробнее"></button></p>
      <details id="spend">
        <summary class="secondary" data-t="Подробнее"></summary>
        <div id="week-strip" hidden>
          <div class="secondary spend-title" data-t="Расход недели по дням, в процентах"></div>
          <div class="week-days" id="week-days"></div>
          <p class="warning" id="week-forecast" hidden></p>
        </div>
        <div class="secondary spend-title" data-t="Расход по проектам"></div>
        <div class="segments" id="spend-periods" role="group" data-t-title="Период"></div>
        <div id="spend-rows"></div>
        <p class="secondary" id="spend-top" hidden></p>
        <button class="link" id="open-history" data-t="История расхода…"></button>
        <p class="secondary spend-note" data-t="Оценка по журналам Claude Code, а не точный расход лимита. Доли учитывают цену токенов (вывод ×5, чтение кэша ×0,1); токены — без чтения кэша."></p>
      </details>
    </section>
    <section class="card sessions">
      <h2 data-t="Сессии Claude Code"></h2>
      <div id="session-rows"></div>
      <details id="resumable" hidden>
        <summary class="secondary" data-t="Недавно завершённые"></summary>
        <div id="resumable-rows"></div>
        <p class="error" id="resumable-error" hidden></p>
      </details>
      <p class="secondary" id="no-sessions" data-t="Сессий Claude Code сейчас нет" hidden></p>
      <div id="no-hooks" hidden>
        <p class="secondary" data-t="Сессии Claude не отслеживаются: hooks не установлены."></p>
        <p style="margin-top: 6px"><button id="hooks-settings" data-t="Настройки…"></button></p>
      </div>
    </section>
    <section class="card resources" id="resources" hidden>
      <div class="resources-head">
        <h2 data-t="Ресурсы компьютера"></h2>
        <span class="spacer"></span>
        <button class="icon-button" id="task-manager" data-t-title="Открыть Диспетчер задач" hidden>▤</button>
      </div>
      <p class="secondary" id="resources-wait" data-t="Считаю…"></p>
      <div class="gauges" id="resources-rows"></div>
      <p class="secondary processes" id="resources-processes" hidden></p>
    </section>
    <section class="card keep-awake" id="keep-awake" hidden>
      <div class="keep-awake-head">
        <h2 data-t="Не спать"></h2>
        <span class="cup" id="keep-awake-cup" aria-hidden="true">☕</span>
        <span class="spacer"></span>
        <input type="checkbox" class="switch" id="keep-awake-switch" data-t-title="Не давать компьютеру засыпать, пока не выключите">
      </div>
      <p class="secondary" id="keep-awake-status"></p>
      <p class="timers">
        <button class="small" data-minutes="15" data-t="15 мин"></button>
        <button class="small" data-minutes="60" data-t="1 ч"></button>
        <button class="small" data-minutes="120" data-t="2 ч"></button>
        <button class="small" id="keep-awake-release" data-t="Отпустить" data-t-title="Снять ручной запрет сна: дальше решают правила" hidden></button>
      </p>
    </section>
    <section class="card quick-commands" id="quick-commands" hidden>
      <h2 data-t="Быстрые команды"></h2>
      <p class="secondary" id="quick-empty" data-t="Команд нет — добавьте в Настройках → «Модули»." hidden></p>
      <div class="quick-grid" id="quick-buttons"></div>
      <div class="quick-confirm" id="quick-confirm" hidden>
        <span id="quick-confirm-text"></span>
        <span class="spacer"></span>
        <button class="small" id="quick-cancel" data-t="Отмена"></button>
        <button class="small prominent" id="quick-run" data-t="Запустить"></button>
      </div>
      <div class="quick-results" id="quick-results"></div>
    </section>
    <section class="card clips" id="clips" hidden>
      <div class="notes-head">
        <h2 data-t="История буфера"></h2>
        <span class="secondary" id="clip-count"></span>
        <span class="spacer"></span>
        <button class="small" id="clip-clear" data-t="Очистить" data-t-title="Удалить всё, кроме закреплённого" hidden></button>
      </div>
      <div class="quick-confirm" id="clip-confirm" hidden>
        <span data-t="Удалить всё, кроме закреплённого"></span>
        <span class="spacer"></span>
        <button class="small" id="clip-cancel" data-t="Отмена"></button>
        <button class="small danger" id="clip-yes" data-t="Очистить"></button>
      </div>
      <p class="secondary" id="clip-empty" data-t="Пока пусто: скопируйте что-нибудь. Пароли из менеджеров паролей не запоминаются." hidden></p>
      <input type="text" id="clip-query" autocomplete="off" spellcheck="false" data-t-placeholder="Поиск" hidden>
      <div id="clip-rows"></div>
      <p class="secondary" id="clip-none" data-t="Ничего не найдено" hidden></p>
    </section>
    <section class="card notes" id="notes" hidden>
      <div class="notes-head">
        <h2 data-t="Заметки"></h2>
        <span class="spacer"></span>
        <button class="small" id="note-new" data-t-title="Новая заметка">+</button>
        <button class="small" id="note-open" data-t-title="Открыть в редакторе">↗</button>
        <button class="small" id="note-trash" data-t-title="В корзину">🗑</button>
      </div>
      <select id="note-names" hidden></select>
      <textarea id="note-text" spellcheck="false"></textarea>
      <p class="note-error" id="note-error" hidden></p>
      <div class="quick-confirm" id="note-confirm" hidden>
        <span id="note-confirm-text"></span>
        <span class="spacer"></span>
        <button class="small" id="note-cancel" data-t="Отмена"></button>
        <button class="small danger" id="note-yes" data-t="В корзину"></button>
      </div>
    </section>
    <section class="card toggles" id="toggles" hidden>
      <h2 data-t="Быстрые переключатели"></h2>
      <div class="tiles" id="toggle-tiles"></div>
      <div class="quick-confirm" id="toggle-confirm" hidden>
        <span id="toggle-confirm-text"></span>
        <span class="spacer"></span>
        <button class="small" id="toggle-cancel" data-t="Отмена"></button>
        <button class="small danger" id="toggle-yes" data-t="Да"></button>
      </div>
      <div class="quick-results" id="toggle-results"></div>
    </section>
    <section class="card upcoming" id="upcoming" hidden>
      <div class="upcoming-head">
        <h2 data-t="Ближайшее"></h2>
        <button class="small" id="open-calendar" data-t="Календарь"></button>
      </div>
      <div id="upcoming-rows"></div>
      <p class="secondary" id="upcoming-empty" data-t="На неделю дат нет." hidden></p>
      <p class="secondary" id="upcoming-more" hidden></p>
    </section>
    <section class="card projects">
      <h2 data-t="Проекты"></h2>
      <div class="word-goal" id="word-goal" hidden>
        <span class="mark" aria-hidden="true"></span><span class="secondary text"></span><span class="secondary streak"></span>
        <span class="word-goal-bar" aria-hidden="true"><span></span></span>
      </div>
      <div id="project-rows"></div>
      <p class="secondary" id="projects-message" hidden></p>
      <div class="new-project" id="new-project" hidden>
        <button class="small" id="new-project-open" data-t="Новый проект"></button>
        <div class="new-project-form" id="new-project-form" hidden>
          <input type="text" id="new-project-name" data-t-placeholder="Название проекта">
          <button id="new-project-create" data-t="Создать"></button>
          <button id="new-project-cancel" data-t="Отмена"></button>
        </div>
        <p class="error" id="new-project-error" hidden></p>
      </div>
    </section>
    <p class="secondary" id="version"></p>
  </main>
  <script type="module">
    import { loadTexts, invoke, t } from "./app.js";
    const ui = await loadTexts();
    // The version line turns into «Доступна версия …» when a check finds one; a click opens Settings.
    const versionLine = document.getElementById("version");
    async function showVersion() {
      const { available } = await invoke("updates_view");
      versionLine.textContent = available ? t("Версия %@", ui.version) + " · " + t("Доступна версия %@", available) : t("Версия %@", ui.version);
      versionLine.style.cursor = available ? "pointer" : "";
      versionLine.onclick = available ? () => invoke("open_settings", { page: "general" }) : null;
    }
    await showVersion();
    window.__TAURI__.event.listen("updates-changed", showVersion);
    document.getElementById("settings").onclick = () => invoke("open_settings");
    document.getElementById("help").onclick = () => invoke("open_help");
    document.getElementById("quit").onclick = () => invoke("quit");
    document.getElementById("refresh").onclick = () => {
      invoke("refresh_limits");
      invoke("refresh_projects");
      invoke("refresh_hub");
    };
    // Other AI services' limits under the main ones: a bar per window that has a percent, else the spend as text.
    function serviceRow(service) {
      const box = document.createElement("div");
      box.className = "hub-service";
      box.append(Object.assign(document.createElement("strong"), { textContent: service.title }));
      if (service.error) box.append(Object.assign(document.createElement("p"), { className: "warning", textContent: service.error }));
      for (const window of service.windows) {
        const row = document.createElement("div");
        row.className = "hub-window";
        row.innerHTML = `<span class="secondary label"></span><span class="bar"><span class="fill"></span></span><span class="value"></span>`;
        row.querySelector(".label").textContent = window.title;
        if (window.percent == null) {
          row.querySelector(".bar").remove();
          row.classList.add("spend");
        } else {
          const fill = row.querySelector(".fill");
          fill.style.width = `${Math.min(100, Math.max(0, window.percent))}%`;
          fill.style.background = window.color;
        }
        row.querySelector(".value").textContent = [window.value, window.detail].filter(Boolean).join(" · ");
        box.append(row);
        const notes = [window.reset, window.forecast].filter(Boolean).join(" · ");
        if (notes) box.append(Object.assign(document.createElement("p"), { className: "secondary note", textContent: notes }));
      }
      return box;
    }
    // «Главный сервис»: its limits as the rings on top; when it isn't Claude, Claude joins «Другие AI».
    let claudeView = null;
    let hubView = { main: "claude", services: [] };
    function drawLimits() {
      if (!claudeView) return;
      const main = hubView.services.find((service) => service.id === hubView.main);
      const claudeRings = [claudeView.session, claudeView.week].filter(Boolean);
      let rings = claudeRings;
      let services = hubView.services;
      let forecast = claudeView.forecast;
      let error = claudeView.error;
      if (main) {
        const windows = main.windows.filter((w) => w.percent != null).slice(0, 2);
        rings = windows.map((w) => ({ title: `${main.title} · ${w.title}`, percent: w.value, fraction: w.percent / 100, color: w.color, reset: w.reset }));
        forecast = windows.map((w) => w.forecast).find(Boolean) ?? null;
        error = main.error;
        const claude = { id: "claude", title: "Claude", error: claudeView.error, windows: [...claudeRings, ...claudeView.others].map((r) => ({ title: r.title, percent: r.fraction * 100, value: r.percent, color: r.color, detail: null, reset: r.reset, forecast: null })) };
        services = [...(claudeRings.length || claudeView.error ? [claude] : []), ...hubView.services.filter((service) => service !== main)];
        if (claudeView.forecast && claude.windows[0]) claude.windows[0].forecast = claudeView.forecast;
      }
      document.getElementById("rings").replaceChildren(...rings.map(ring));
      const others = document.getElementById("others");
      others.replaceChildren(...(main ? [] : claudeView.others).map((other) => {
        const row = document.createElement("p");
        row.className = "secondary";
        row.textContent = `${other.title}: ${other.percent}`;
        return row;
      }));
      const forecastLine = document.getElementById("forecast");
      forecastLine.hidden = !forecast;
      forecastLine.textContent = forecast ?? "";
      const errorLine = document.getElementById("limits-error");
      errorLine.hidden = !error;
      errorLine.textContent = error ?? "";
      // Anthropic's status page reports trouble: the failure is theirs, not this computer's.
      document.getElementById("limits-outage").hidden = !claudeView.outage;
      document.getElementById("limits-outage-text").textContent = claudeView.outage ?? "";
      document.getElementById("limits-outage-more").onclick = () => invoke("open_status_page");
      document.getElementById("hub").hidden = services.length === 0;
      document.getElementById("hub-rows").replaceChildren(...services.map(serviceRow));
    }
    async function showHub() {
      hubView = await invoke("hub_view");
      drawLimits();
    }
    showHub();
    window.__TAURI__.event.listen("hub-changed", showHub);
    // The profile switcher, once there are two: the projects folder and where Claude runs are the profile's.
    const profileSwitch = document.getElementById("profile-switch");
    async function showProfiles() {
      const view = await invoke("profiles_view");
      profileSwitch.replaceChildren(...view.rows.map((row) => new Option(row.name, row.id, row.current, row.current)));
      profileSwitch.hidden = view.rows.length < 2;
      // No profile yet (the Mac's empty start): the assistant or a .claudepult file makes the first one.
      document.getElementById("create-profile").hidden = view.rows.length > 0;
      document.querySelector(".card.projects").hidden = view.rows.length === 0;
    }
    document.getElementById("create-assistant").onclick = () => invoke("open_assistant");
    // «Заменить» / «Добавить» are asked in Settings, as on the Mac.
    document.getElementById("create-import").onclick = async () => {
      const view = await invoke("choose_import");
      const error = document.getElementById("create-error");
      error.hidden = !view.message;
      error.textContent = view.message ?? "";
      if (!view.title) return;
      await invoke("open_settings", { page: "general" });
      window.__TAURI__.event.emit("import-pending");
    };
    profileSwitch.onchange = () => invoke("select_profile", { id: profileSwitch.value });
    showProfiles();
    window.__TAURI__.event.listen("profiles-changed", showProfiles);
    const hint = document.getElementById("tray-hint");
    hint.hidden = !ui.showTrayHint;
    document.getElementById("tray-hint-done").onclick = async () => {
      await invoke("dismiss_tray_hint");
      hint.hidden = true;
    };
    window.addEventListener("keydown", (event) => { if (event.key === "Escape") invoke("hide_panel"); });

    // A limit as a ring, like the Mac panel: the used part from twelve o'clock, coloured by level.
    function ring(view) {
      const r = 15, length = 2 * Math.PI * r;
      const item = document.createElement("div");
      item.className = "ring";
      item.innerHTML = `
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
          <circle cx="20" cy="20" r="${r}" fill="none" stroke="${view.color}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${length * view.fraction} ${length}" transform="rotate(-90 20 20)"/>
        </svg>
        <div><div class="value"></div><div class="secondary title"></div><div class="secondary reset"></div></div>`;
      item.querySelector(".value").textContent = view.percent;
      item.querySelector(".value").style.color = view.color;
      item.querySelector(".title").textContent = view.title;
      item.querySelector(".reset").textContent = view.reset ?? "";
      return item;
    }

    async function showLimits() {
      claudeView = await invoke("limits_view");
      drawLimits();
    }

    await showLimits();
    window.__TAURI__.event.listen("limits-changed", showLimits);

    // «Расход по проектам» under «Подробнее»: counted from Claude Code's journals when it is opened, for the session,
    // today or the week.
    {
      const box = document.getElementById("spend");
      const rows = document.getElementById("spend-rows");
      const top = document.getElementById("spend-top");
      const periods = document.getElementById("spend-periods");
      let chosen = "session";
      let view = null;
      const show = () => {
        const line = (text) => { const p = document.createElement("p"); p.className = "secondary"; p.textContent = text; return p; };
        if (!view) {
          periods.replaceChildren();
          rows.replaceChildren(line(t("Считаю по журналам Claude Code…")));
          top.hidden = true;
          return;
        }
        // The week by day: a column a day, today's in the accent colour; a week that resets in the middle of a day
        // touches eight days, and then its first and last columns say the date too.
        const week = view.week;
        document.getElementById("week-strip").hidden = !week || week.days.length === 0;
        if (week) {
            const lang = document.documentElement.lang || undefined;
            const highest = Math.max(...week.days.map((day) => day.percent), 1);
            document.getElementById("week-days").replaceChildren(...week.days.map((day, index) => {
              const date = new Date(day.day + "T12:00:00");
              const column = document.createElement("div");
              column.className = "week-day" + (day.today ? " today" : "");
              const rounded = Math.round(day.percent);
              column.title = t("%@: %lld %% недельного лимита", new Intl.DateTimeFormat(lang, { weekday: "long", day: "numeric", month: "long" }).format(date), rounded);
              const value = document.createElement("span");
              value.className = "secondary";
              value.textContent = day.percent >= 0.5 ? rounded : "";
              const bar = document.createElement("div");
              bar.className = "bar";
              bar.style.height = `${Math.max(2, 22 * day.percent / highest)}px`;
              const label = document.createElement("span");
              let weekday = new Intl.DateTimeFormat(lang, { weekday: "short" }).format(date);
              weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
              const edge = week.days.length > 7 && (index === 0 || index === week.days.length - 1);
              label.textContent = edge ? `${weekday} ${date.getDate()}` : weekday;
              column.append(value, bar, label);
              return column;
            }));
            const forecast = document.getElementById("week-forecast");
            forecast.hidden = !week.forecast;
            forecast.textContent = week.forecast ?? "";
        }
        periods.replaceChildren(...view.periods.map((period) => {
          const button = document.createElement("button");
          button.className = "small" + (period.id === chosen ? " chosen" : "");
          button.textContent = period.title;
          button.setAttribute("aria-pressed", period.id === chosen);
          button.onclick = () => { chosen = period.id; show(); };
          return button;
        }));
        const period = view.periods.find((p) => p.id === chosen) ?? view.periods[0];
        rows.replaceChildren(...(period.rows.length ? period.rows.map((row) => {
          const item = document.createElement("div");
          item.className = "spend-row";
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = name.title = row.name;
          const tokens = document.createElement("span");
          tokens.className = "secondary";
          tokens.textContent = row.tokens;
          const percent = document.createElement("span");
          percent.className = "percent";
          percent.textContent = row.percent;
          item.append(name, tokens, percent);
          return item;
        }) : [line(t("За этот период расхода нет"))]));
        top.hidden = !period.top;
        top.textContent = period.top ?? "";
      };
      const load = async () => {
        if (!box.open) return;
        show();
        try { view = await invoke("spend_view"); } catch { view = { periods: [], week: null }; }
        show();
      };
      box.addEventListener("toggle", load);
      document.getElementById("open-history").onclick = () => invoke("open_history");
      window.__TAURI__.event.listen("limits-changed", load);
    }

    // A permission request under its session: what is asked and «Разрешить» / «Отклонить», as in the Mac panel.
    // Claude's own dialog is on screen too; the first answer applies.
    function request(view) {
      const box = document.createElement("div");
      box.className = "request";
      box.innerHTML = `<span class="secondary text"></span><button class="allow"></button><button class="deny"></button><p class="error" hidden></p>`;
      box.querySelector(".text").textContent = view.text;
      box.title = `${view.title}: ${view.text}`;
      const buttons = [box.querySelector(".allow"), box.querySelector(".deny")];
      buttons[0].textContent = t("Разрешить");
      buttons[1].textContent = t("Отклонить");
      buttons.forEach((button, index) => {
        button.onclick = async () => {
          buttons.forEach((b) => (b.disabled = true));
          try {
            await invoke("decide_request", { id: view.id, allow: index === 0 });
          } catch (error) {
            const message = box.querySelector(".error");
            message.textContent = String(error);
            message.hidden = false;
            buttons.forEach((b) => (b.disabled = false));
          }
        };
      });
      return box;
    }

    // A background run under its row: «Остановить» (a second click within a few seconds stops it), «Журнал», its PR.
    const openLogs = new Set();
    const confirmStop = new Set();
    // «Изменения: файлов: 3 +120 −8» under a session or run: a click lists the files, a click on a file opens it.
    const openChanges = new Set();
    function changesOf(id, changes) {
      const toggle = element("button", "link changes-toggle", t("Изменения: %@", changes.summary));
      toggle.onclick = () => { if (openChanges.has(id)) openChanges.delete(id); else openChanges.add(id); showSessions(); };
      if (!openChanges.has(id)) return [toggle];
      const list = element("div", "changes");
      const head = element("div", "changes-head");
      head.append(element("strong", "", t("Изменения сессии")), element("span", "secondary", changes.summary));
      list.append(head);
      const files = element("div", "changes-files");
      list.append(files);
      for (const file of changes.files) {
        const line = element("button", "changed-file");
        line.title = t("Открыть %@", file.path);
        // The mark keeps a leading dot in its place: the span is cut from the left.
        line.append(element("span", "path", "‎" + file.path));
        if (file.note) line.append(element("span", file.isNew ? "added" : "secondary", file.note));
        if (file.added) line.append(element("span", "added", file.added), element("span", "removed", file.removed));
        line.onclick = () => invoke("open_changed", { folder: changes.folder, path: file.path }).catch(() => {});
        files.append(line);
      }
      if (changes.more > 0) list.append(element("div", "secondary", `+ ${changes.more}`));
      const foot = element("div", "changes-foot");
      const folder = element("span", "secondary path", changes.folder);
      folder.title = changes.folder;
      foot.append(action(t("Показать папку"), () => invoke("open_changed", { folder: changes.folder, path: "" }).catch(() => {})), folder);
      list.append(foot);
      return [toggle, list];
    }
    const runErrors = new Map();
    function runControls(run) {
      const line = document.createElement("div");
      line.className = "run-controls";
      const button = (title, onclick) => {
        const b = document.createElement("button");
        b.className = "small";
        b.textContent = title;
        b.onclick = onclick;
        return b;
      };
      if (run.paused) line.append(button(t("Продолжить сейчас"), () => invoke("resume_run_now", { id: run.id })));
      // The other service: Codex goes on with a task Claude left at its limit, or one reads what the other did.
      const beside = (title, command) => button(title, async (event) => {
        event.target.disabled = true;
        try { await invoke(command, { id: run.id }); } catch (problem) { runErrors.set(run.id, String(problem)); showSessions(); }
      });
      if (run.handover) line.append(beside(t("Передать %@", "Codex"), "hand_over_run"));
      if (run.review) line.append(beside(t("Проверить в %@", run.review), "review_run"));
      if (run.compare) line.append(button(t("Сравнить с %@", run.compare), () => invoke("open_pair_compare", { id: run.id })));
      if (run.running) {
        const asking = confirmStop.has(run.id);
        line.append(button(asking ? t("Остановить?") : t("Остановить"), () => {
          if (confirmStop.has(run.id)) {
            confirmStop.delete(run.id);
            invoke("stop_run", { id: run.id });
          } else {
            confirmStop.add(run.id);
            setTimeout(() => { confirmStop.delete(run.id); showSessions(); }, 4000);
          }
          showSessions();
        }));
      }
      line.append(button(t("Журнал"), () => {
        if (openLogs.has(run.id)) openLogs.delete(run.id); else openLogs.add(run.id);
        showSessions();
      }));
      if (run.pullRequest) line.append(button("PR", () => invoke("open_link", { url: run.pullRequest })));
      const parts = [line];
      if (runErrors.has(run.id)) parts.push(element("div", "error", runErrors.get(run.id)));
      if (openLogs.has(run.id)) {
        const log = document.createElement("div");
        log.className = "run-log";
        invoke("run_log", { id: run.id }).then((entries) => {
          log.replaceChildren(...entries.map((entry) => {
            const line = document.createElement("div");
            line.className = `entry ${entry.kind}`;
            line.textContent = entry.text;
            return line;
          }));
          log.scrollTop = log.scrollHeight;
        }, (error) => { log.textContent = String(error); });
        parts.push(log);
      }
      return parts;
    }

    // Sessions, as the Mac panel lists them: state, project, what it waits for or does, the task list's progress.
    async function showSessions() {
      const view = await invoke("sessions_view");
      const rows = document.getElementById("session-rows");
      (window.searchData ??= {}).sessions = view.rows.map((row) => ({ id: row.id, name: row.project, detail: row.detail ?? "" }));
      rows.replaceChildren(...view.rows.flatMap((row) => {
        const item = document.createElement("div");
        item.className = `session ${row.state}`;
        item.dataset.search = row.id;
        item.innerHTML = `<span class="dot" aria-hidden="true"></span><span class="project"></span><span class="secondary worktree" hidden></span><span class="secondary detail"></span><span class="context" hidden></span><span class="quiet" hidden></span><span class="secondary progress"></span>`;
        item.querySelector(".project").textContent = row.project;
        if (row.context) {
          const context = item.querySelector(".context");
          context.textContent = row.context;
          context.classList.toggle("full", row.contextFull);
          context.title = t("Насколько заполнен контекст сессии (по журналу Claude Code). Ближе к 100 %, Claude сжимает историю и часть деталей теряется.");
          context.hidden = false;
        }
        if (row.quiet) {
          const quiet = item.querySelector(".quiet");
          quiet.textContent = row.quiet;
          quiet.title = t("Придёт уведомление, если агент 20 минут ничего не делает или раз за разом запускает одну и ту же команду.");
          quiet.hidden = false;
        }
        if (row.worktree) {
          const worktree = item.querySelector(".worktree");
          worktree.textContent = "⎇ " + row.worktree;
          worktree.title = t("Отдельная рабочая копия git (worktree)");
          worktree.hidden = false;
        }
        item.querySelector(".detail").textContent = row.detail ?? row.stateTitle;
        item.querySelector(".progress").textContent = row.progress ?? "";
        item.title = `${row.project}${row.worktree ? " ⎇ " + row.worktree : ""} · ${row.stateTitle}${row.detail ? " · " + row.detail : ""}`;
        const extra = row.run ? runControls(row.run) : [];
        if (row.changes) extra.push(...changesOf(row.id, row.changes));
        return [item, ...extra, ...(row.request ? [request(row.request)] : [])];
      }));
      // «Недавно завершённые»: a click continues the session in a terminal (`claude --resume`).
      const finished = document.getElementById("resumable");
      finished.hidden = view.resumable.length === 0;
      document.getElementById("resumable-rows").replaceChildren(...view.resumable.map((row) => {
        const item = document.createElement("button");
        item.className = "resumable";
        item.title = row.hint;
        item.innerHTML = `<span aria-hidden="true">↩</span><span class="project"></span><span class="secondary detail"></span><span class="secondary ago"></span>`;
        item.querySelector(".project").textContent = row.project;
        item.querySelector(".detail").textContent = row.task ?? "";
        item.querySelector(".ago").textContent = row.ago;
        item.onclick = async () => {
          const error = document.getElementById("resumable-error");
          error.hidden = true;
          try { await invoke("resume_session", { id: row.id }); } catch (problem) { error.hidden = false; error.textContent = String(problem); }
        };
        return item;
      }));
      // Runs put off for the night or until the limit resets, each with «Отменить».
      const queued = await invoke("queued_view");
      rows.append(...queued.map((waiting) => {
        const item = element("div", "queued");
        const clock = element("span", "", "🕓");
        clock.setAttribute("aria-hidden", "true");
        const text = element("span", "text", waiting.text);
        text.title = waiting.text;
        item.append(clock, text, action(t("Отменить"), () => invoke("cancel_queued", { id: waiting.id })));
        return item;
      }));
      document.getElementById("no-hooks").hidden = view.hooks === "installed";
      document.getElementById("no-sessions").hidden = view.rows.length > 0 || queued.length > 0 || view.hooks !== "installed";
    }
    document.getElementById("hooks-settings").onclick = () => invoke("open_settings", { page: "services" });
    await showSessions();
    window.__TAURI__.event.listen("sessions-changed", showSessions);
    // Finished sessions change without an event of their own: read them when the panel is opened.
    window.addEventListener("focus", showSessions);

    // «Ресурсы компьютера»: processor, memory, graphics, disk as bars; network and battery as text; the programs
    // using the most processor. Read every 2 s while the panel is visible.
    const resourceColor = (value) => (value > 80 ? "#ff3b30" : value >= 50 ? "#ff9500" : "#34c759");
    const percent = (value) => new Intl.NumberFormat(document.documentElement.lang || undefined, { style: "percent", maximumFractionDigits: 0 }).format(value / 100);
    // Sizes as the Mac's ByteCountFormatter: 1000 for disks and speed, 1024 for memory; units from the webview's Intl.
    function bytes(value, base = 1000) {
      const units = ["byte", "kilobyte", "megabyte", "gigabyte", "terabyte"];
      let unit = 0;
      while (value >= base && unit < units.length - 1) { value /= base; unit++; }
      return new Intl.NumberFormat(document.documentElement.lang || undefined, { style: "unit", unit: units[unit], unitDisplay: "short", maximumFractionDigits: value < 10 && unit > 0 ? 1 : 0 }).format(value);
    }
    function gauge(title, value, detail, warning) {
      const row = document.createElement("div");
      row.className = "gauge";
      row.innerHTML = `<span class="secondary label"></span><span class="bar"><span class="fill"></span></span><span class="value"><strong></strong> <span></span></span>`;
      row.querySelector(".label").textContent = title;
      const fill = row.querySelector(".fill");
      fill.style.width = `${Math.min(Math.max(value, 0), 100)}%`;
      fill.style.background = resourceColor(value);
      row.querySelector("strong").textContent = percent(value);
      const note = row.querySelector(".value span");
      note.textContent = warning ?? detail ?? "";
      note.className = warning ? "warning" : "secondary";
      return row;
    }
    function textRow(title, text, alarm) {
      const row = document.createElement("div");
      row.className = "gauge";
      row.innerHTML = `<span class="secondary label"></span><span class="text"></span>`;
      row.querySelector(".label").textContent = title;
      row.querySelector(".text").textContent = text;
      if (alarm) row.querySelector(".text").classList.add("error");
      return row;
    }
    function batteryText(battery) {
      if (battery.charging) return t("%lld %% · заряжается", battery.percent);
      if (battery.onAc) return t("%lld %% · от сети", battery.percent);
      if (battery.minutesLeft == null) return percent(battery.percent);
      return t("%lld %% · осталось %lld ч %lld мин", battery.percent, Math.floor(battery.minutesLeft / 60), battery.minutesLeft % 60);
    }
    async function showResources() {
      const view = await invoke("resources_view");
      const card = document.getElementById("resources");
      card.hidden = !view.shown;
      if (!view.shown) return;
      document.getElementById("task-manager").hidden = !view.taskManager;
      const snapshot = view.snapshot;
      document.getElementById("resources-wait").hidden = !!snapshot;
      if (!snapshot) return;
      const shows = (metric) => view.metrics.includes(metric);
      const rows = [];
      if (shows("cpu")) rows.push(gauge(t("Процессор"), snapshot.cpu));
      if (shows("memory")) {
        const used = snapshot.memoryTotal ? (snapshot.memoryUsed / snapshot.memoryTotal) * 100 : 0;
        const warning = { warning: t("давление повышено"), critical: t("памяти не хватает") }[snapshot.pressure];
        rows.push(gauge(t("Память"), used, `${bytes(snapshot.memoryUsed, 1024)} / ${bytes(snapshot.memoryTotal, 1024)}`, warning));
      }
      if (shows("gpu") && snapshot.gpu != null) rows.push(gauge(t("Графика"), snapshot.gpu));
      if (shows("disk") && snapshot.diskTotal) rows.push(gauge(t("Диск"), ((snapshot.diskTotal - snapshot.diskFree) / snapshot.diskTotal) * 100, t("свободно %@", bytes(snapshot.diskFree))));
      if (shows("network")) rows.push(textRow(t("Сеть"), `↓ ${t("%@/с", bytes(snapshot.networkIn))}   ↑ ${t("%@/с", bytes(snapshot.networkOut))}`));
      if (shows("battery") && snapshot.battery) rows.push(textRow(t("Батарея"), batteryText(snapshot.battery), !snapshot.battery.onAc && snapshot.battery.percent < 15));
      document.getElementById("resources-rows").replaceChildren(...rows);
      const processes = document.getElementById("resources-processes");
      processes.hidden = !shows("processes") || !view.processes.length;
      processes.textContent = view.processes.slice(0, 3).map((p) => `${p.name} ${percent(p.cpu)}`).join(" · ");
      processes.title = view.processes.map((p) => `${p.name} — ${percent(p.cpu)}`).join("\n");
    }
    document.getElementById("task-manager").onclick = () => invoke("open_task_manager");
    showResources();
    window.__TAURI__.event.listen("resources-changed", showResources);
    window.__TAURI__.event.listen("profiles-changed", showResources);
    setInterval(() => { if (!document.hidden && !document.getElementById("resources").hidden) showResources(); }, 2000);
    window.addEventListener("focus", showResources);

    // «Быстрые команды»: the library as buttons, two per row; «Запустить?» first for a command that asks; the last
    // result of each under them.
    let confirming = null;
    async function showQuickCommands() {
      const view = await invoke("quick_commands_view");
      document.getElementById("quick-commands").hidden = !view.shown;
      (window.searchData ??= {}).quick = view.shown ? view.buttons.map((command) => ({ id: command.id, name: command.title, detail: command.value ?? "" })) : [];
      if (!view.shown) return;
      document.getElementById("quick-empty").hidden = view.buttons.length > 0;
      document.getElementById("quick-buttons").replaceChildren(...view.buttons.map((command) => {
        const button = document.createElement("button");
        button.className = "quick";
        button.dataset.search = command.id;
        button.title = command.hotKey ? `${command.value}
${command.hotKey}` : command.value;
        button.disabled = command.running;
        button.innerHTML = `<span class="glyph" aria-hidden="true"></span><span class="name"></span>`;
        button.querySelector(".glyph").textContent = command.running ? "…" : command.glyph;
        button.querySelector(".name").textContent = command.title;
        button.onclick = () => {
          if (command.confirm) { confirming = command; return showConfirm(); }
          invoke("run_quick_command", { id: command.id });
        };
        return button;
      }));
      if (confirming && !view.buttons.some((b) => b.id === confirming.id)) confirming = null;
      showConfirm();
      document.getElementById("quick-results").replaceChildren(...view.buttons.filter((b) => b.result).map((command) => {
        const line = document.createElement("p");
        line.className = command.result.isError ? "warning" : "secondary";
        line.textContent = `${command.result.isError ? "⚠" : "✓"} ${command.title}: ${command.result.text}`;
        return line;
      }));
    }
    function showConfirm() {
      document.getElementById("quick-confirm").hidden = !confirming;
      if (confirming) document.getElementById("quick-confirm-text").textContent = t("Запустить «%@»?", confirming.title);
    }
    document.getElementById("quick-cancel").onclick = () => { confirming = null; showConfirm(); };
    document.getElementById("quick-run").onclick = () => {
      const command = confirming;
      confirming = null;
      showConfirm();
      if (command) invoke("run_quick_command", { id: command.id });
    };
    showQuickCommands();
    window.__TAURI__.event.listen("quick-commands-changed", showQuickCommands);
    window.__TAURI__.event.listen("profiles-changed", showQuickCommands);

    // «Быстрые переключатели»: tiles, each run on a click; the Recycle Bin asks «…? Это нельзя отменить.» first.
    let askingToggle = null;
    let toggleQuestions = {};
    async function showToggles() {
      const view = await invoke("toggles_view");
      document.getElementById("toggles").hidden = !view.shown;
      if (!view.shown) return;
      toggleQuestions = view.questions;
      document.getElementById("toggle-tiles").replaceChildren(...view.tiles.map((tile) => {
        const button = document.createElement("button");
        button.className = tile.on ? "tile on" : "tile";
        button.title = tile.hint;
        button.disabled = tile.running;
        if (tile.on !== null) button.setAttribute("aria-pressed", String(tile.on));
        button.innerHTML = `<span class="glyph" aria-hidden="true"></span><span class="name"></span>`;
        button.querySelector(".glyph").textContent = tile.running ? "…" : tile.glyph;
        button.querySelector(".name").textContent = tile.shortTitle;
        button.setAttribute("aria-label", tile.hint);
        button.onclick = () => {
          if (tile.confirm) { askingToggle = tile.id; return showToggleQuestion(); }
          invoke("perform_toggle", { id: tile.id });
        };
        return button;
      }));
      showToggleQuestion();
      document.getElementById("toggle-results").replaceChildren(...view.results.map((result) => {
        const line = document.createElement("p");
        line.className = result.isError ? "warning" : "secondary";
        line.textContent = `${result.isError ? "⚠" : "✓"} ${result.text}`;
        return line;
      }));
    }
    function showToggleQuestion() {
      document.getElementById("toggle-confirm").hidden = !askingToggle;
      if (askingToggle) document.getElementById("toggle-confirm-text").textContent = toggleQuestions[askingToggle] ?? "";
    }
    document.getElementById("toggle-cancel").onclick = () => { askingToggle = null; showToggleQuestion(); };
    document.getElementById("toggle-yes").onclick = () => {
      const id = askingToggle;
      askingToggle = null;
      showToggleQuestion();
      if (id) invoke("perform_toggle", { id });
    };
    showToggles();
    window.__TAURI__.event.listen("toggles-changed", showToggles);

    // The search under the header: sessions, projects and quick commands by name; ↑ ↓ choose, Enter does the
    // chosen one, Esc clears the text and, with nothing typed, puts the panel away.
    const searchField = document.getElementById("search-field");
    const searchResults = document.getElementById("search-results");
    const searchClear = document.getElementById("search-clear");
    searchField.setAttribute("aria-label", t("Найти проект, сессию, команду…"));
    let found = [], foundAt = 0, searchTurn = 0;
    // A saved prompt was chosen: the list is now the projects to start it in.
    let promptStep = null;
    const searchPlaceholder = searchField.placeholder;
    function showFound() {
      searchResults.hidden = !searchField.value.trim() && !promptStep;
      searchClear.hidden = !searchField.value;
      if (searchResults.hidden) return searchResults.replaceChildren();
      if (!found.length) {
        const empty = document.createElement("p");
        empty.className = "secondary";
        empty.textContent = promptStep ? t("Нет такого проекта") : t("Ничего не найдено");
        return searchResults.replaceChildren(empty);
      }
      searchResults.replaceChildren(...found.map((row, index) => {
        const button = document.createElement("button");
        button.className = index === foundAt ? "found chosen" : "found";
        button.title = row.hint;
        button.innerHTML = `<span class="glyph" aria-hidden="true"></span><span class="name"></span><span class="secondary detail"></span><span class="secondary enter" aria-hidden="true"></span>`;
        button.querySelector(".glyph").textContent = { session: "💬", project: "📁", quickCommand: "⚡", prompt: "📝" }[row.kind];
        button.querySelector(".name").textContent = row.title;
        button.querySelector(".detail").textContent = row.detail;
        button.querySelector(".enter").textContent = index === foundAt ? "↵" : "";
        button.onclick = () => doFound(row);
        return button;
      }));
    }
    async function search() {
      const turn = ++searchTurn;
      const data = window.searchData ?? {};
      const rows = promptStep
        ? (await invoke("prompt_projects", { query: searchField.value, projects: data.projects ?? [] })).map((p) => ({ kind: "project", id: p.id, title: p.name, detail: p.detail, hint: p.hint }))
        : searchField.value.trim()
        ? await invoke("panel_search", { query: searchField.value, sessions: data.sessions ?? [], projects: data.projects ?? [], quickCommands: data.quick ?? [], withPrompts: !data.folders })
        : [];
      if (turn !== searchTurn) return;
      found = rows;
      foundAt = 0;
      showFound();
    }
    function clearSearch() {
      promptStep = null;
      searchField.placeholder = searchPlaceholder;
      searchField.value = "";
      search();
    }
    // The row the search found: brought into view and marked for a moment.
    function pointAt(id, block = "center") {
      const row = [...document.querySelectorAll("[data-search]")].find((item) => item.dataset.search === id);
      if (!row) return null;
      row.scrollIntoView({ block, behavior: "smooth" });
      row.classList.add("pointed");
      setTimeout(() => row.classList.remove("pointed"), 1600);
      return row;
    }
    // The prompt with the project's name and branch, started as «Своя задача…» of that project: its row shows
    // what the start said, or asks how to start.
    async function startPrompt(prompt, project) {
      let next;
      try {
        const task = await invoke("fill_saved_prompt", { id: prompt, project: project.title, branch: project.detail || null });
        expanded.add(project.id);
        launches.set(project.id, { working: true });
        await showProjects();
        pointAt(project.id, "start");
        const reply = await invoke("launch_claude", { path: project.id, command: "custom", task, allowBusy: false, mode: null, remember: false, agent: null, skipLimit: false });
        next = reply.choose
          ? { choose: { question: reply.choose, command: "custom", task, allowBusy: false } }
          : { message: reply.message, confirm: reply.confirm ? { command: "custom", task, mode: null, agent: null } : null, limit: reply.limit ? { command: "custom", task, allowBusy: false } : null };
      } catch (error) {
        next = { message: String(error), error: true };
      }
      launches.set(project.id, next);
      showProjects();
    }
    async function doFound(row) {
      if (promptStep) {
        const prompt = promptStep;
        clearSearch();
        return startPrompt(prompt, row);
      }
      if (row.kind === "prompt") {
        promptStep = row.id;
        searchField.placeholder = row.placeholder;
        searchField.value = "";
        searchField.focus();
        return search();
      }
      clearSearch();
      if (row.kind === "project") {
        expanded.add(row.id);
        await showProjects();
        pointAt(row.id, "start");
      } else if (row.kind === "quickCommand") {
        pointAt(row.id)?.click();
      } else {
        pointAt(row.id);
      }
    }
    searchField.oninput = search;
    // The hot key and `--app-command search` bring the panel up for typing at once.
    window.__TAURI__.event.listen("focus-search", () => { searchField.focus(); searchField.select(); });
    searchClear.onclick = () => { clearSearch(); searchField.focus(); };
    searchField.onkeydown = (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        foundAt = Math.min(Math.max(foundAt + (event.key === "ArrowDown" ? 1 : -1), 0), Math.max(found.length - 1, 0));
        showFound();
      } else if (event.key === "Enter") {
        if (found[foundAt]) doFound(found[foundAt]);
      } else if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        if (searchField.value || promptStep) clearSearch(); else invoke("hide_panel");
      }
    };

    // «История буфера»: a click puts an entry back on the clipboard; pin, remove, clear.
    const clipQuery = document.getElementById("clip-query");
    clipQuery.setAttribute("aria-label", t("Поиск"));
    let clipCopied = null;
    function showClips(view) {
      document.getElementById("clips").hidden = !view.shown;
      if (!view.shown) return;
      document.getElementById("clip-count").textContent = view.count ? String(view.count) : "";
      document.getElementById("clip-clear").hidden = !view.count;
      if (!view.count) document.getElementById("clip-confirm").hidden = true;
      document.getElementById("clip-empty").hidden = view.count > 0;
      clipQuery.hidden = !view.count;
      document.getElementById("clip-none").hidden = !view.count || view.rows.length > 0;
      document.getElementById("clip-rows").replaceChildren(...view.rows.map((row) => {
        const item = document.createElement("div");
        item.className = row.pinned ? "clip pinned" : "clip";
        item.innerHTML = `<span class="glyph" aria-hidden="true"></span><button class="text"></button><span class="secondary ago"></span><button class="icon-button pin"></button><button class="icon-button remove">✕</button>`;
        item.querySelector(".glyph").textContent = row.files ? "📄" : row.pinned ? "📌" : "📋";
        item.querySelector(".glyph").title = row.pinned ? t("Закреплено") : row.files ? t("Скопированные файлы") : t("Скопированный текст");
        const text = item.querySelector(".text");
        text.textContent = row.text;
        text.title = row.hint;
        const ago = item.querySelector(".ago");
        ago.textContent = clipCopied === row.id ? t("скопировано") : row.ago;
        ago.classList.toggle("done", clipCopied === row.id);
        text.onclick = async () => {
          clipCopied = row.id;
          showClips(await invoke("clipboard_copy", { id: row.id, query: clipQuery.value }));
          setTimeout(() => { if (clipCopied === row.id) { clipCopied = null; refreshClips(); } }, 2000);
        };
        const pin = item.querySelector(".pin");
        pin.textContent = row.pinned ? "⊘" : "📌";
        pin.title = row.pinned ? t("Открепить") : t("Закрепить");
        pin.setAttribute("aria-label", pin.title);
        pin.onclick = async () => showClips(await invoke("clipboard_pin", { id: row.id, query: clipQuery.value }));
        const remove = item.querySelector(".remove");
        remove.title = t("Удалить");
        remove.setAttribute("aria-label", t("Удалить"));
        remove.onclick = async () => showClips(await invoke("clipboard_remove", { id: row.id, query: clipQuery.value }));
        return item;
      }));
    }
    const refreshClips = async () => showClips(await invoke("clipboard_view", { query: clipQuery.value }));
    clipQuery.oninput = refreshClips;
    clipQuery.onkeydown = (event) => { if (event.key === "Escape" && clipQuery.value) { event.stopPropagation(); clipQuery.value = ""; refreshClips(); } };
    document.getElementById("clip-clear").onclick = () => { document.getElementById("clip-confirm").hidden = false; };
    document.getElementById("clip-cancel").onclick = () => { document.getElementById("clip-confirm").hidden = true; };
    document.getElementById("clip-yes").onclick = async () => {
      document.getElementById("clip-confirm").hidden = true;
      clipQuery.value = "";
      showClips(await invoke("clipboard_clear"));
    };
    refreshClips();
    window.addEventListener("focus", refreshClips);
    window.__TAURI__.event.listen("clipboard-changed", refreshClips);
    window.__TAURI__.event.listen("profiles-changed", refreshClips);

    // «Что нового»: once per version with news, until «Понятно».
    invoke("whats_new_view").then((items) => {
      document.getElementById("whats-new").hidden = items.length === 0;
      document.getElementById("whats-new-items").replaceChildren(...items.map((line) => {
        const item = document.createElement("li");
        item.textContent = line;
        return item;
      }));
    });
    const closeWhatsNew = async () => {
      document.getElementById("whats-new").hidden = true;
      await invoke("whats_new_seen");
    };
    document.getElementById("whats-new-done").onclick = closeWhatsNew;
    document.getElementById("whats-new-settings").onclick = async () => { await closeWhatsNew(); invoke("open_settings"); };

    // «Заметки»: a note per .md file. What is typed is written a second after the last key, and when the note,
    // the panel or the window is left; a note changed in another editor is read again when the panel comes back.
    const noteText = document.getElementById("note-text");
    const noteNames = document.getElementById("note-names");
    const noteError = document.getElementById("note-error");
    document.getElementById("note-names").setAttribute("aria-label", t("Заметки"));
    let noteShown = null, noteDirty = false, noteTimer = null;
    function showNotes(view) {
      document.getElementById("notes").hidden = !view.shown;
      noteShown = view.selected;
      noteDirty = false;
      noteNames.hidden = view.names.length < 2;
      noteNames.replaceChildren(...view.names.map((name) => new Option(name, name, false, name === view.selected)));
      noteText.value = view.text;
      noteText.disabled = !view.selected;
      document.getElementById("note-confirm").hidden = true;
      document.getElementById("note-confirm-text").textContent = view.question || "";
      for (const id of ["note-open", "note-trash"]) document.getElementById(id).disabled = !view.selected;
    }
    async function saveNote() {
      clearTimeout(noteTimer);
      if (!noteDirty || !noteShown) return;
      const text = noteText.value;
      try {
        await invoke("notes_save", { name: noteShown, text });
        if (noteText.value === text) noteDirty = false;
        noteError.hidden = true;
      } catch (error) {
        noteError.textContent = String(error);
        noteError.hidden = false;
      }
    }
    noteText.oninput = () => {
      noteDirty = true;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(saveNote, 1000);
    };
    noteText.onblur = saveNote;
    window.addEventListener("blur", saveNote);
    const refreshNotes = async () => { if (!noteDirty) showNotes(await invoke("notes_view")); };
    noteNames.onchange = async () => { await saveNote(); showNotes(await invoke("notes_select", { name: noteNames.value })); };
    const noteAction = async (command, args) => {
      await saveNote();
      try {
        const view = await invoke(command, args);
        if (view) showNotes(view);
        noteError.hidden = true;
      } catch (error) {
        noteError.textContent = String(error);
        noteError.hidden = false;
      }
    };
    document.getElementById("note-new").onclick = () => noteAction("notes_create");
    document.getElementById("note-open").onclick = () => noteAction("notes_open", { name: noteShown });
    document.getElementById("note-trash").onclick = () => { document.getElementById("note-confirm").hidden = false; };
    document.getElementById("note-cancel").onclick = () => { document.getElementById("note-confirm").hidden = true; };
    document.getElementById("note-yes").onclick = () => { noteDirty = false; noteAction("notes_trash", { name: noteShown }); };
    refreshNotes();
    window.addEventListener("focus", refreshNotes);
    window.__TAURI__.event.listen("notes-changed", refreshNotes);
    window.__TAURI__.event.listen("profiles-changed", refreshNotes);
    window.__TAURI__.event.listen("profiles-changed", showToggles);
    // Dark mode or the icons may be switched elsewhere: read again when the panel comes forward.
    window.addEventListener("focus", showToggles);

    // «Не спать»: what holds the computer, the switch (until switched off) and quick timers; the rules decide the rest.
    const keepAwakeSwitch = document.getElementById("keep-awake-switch");
    keepAwakeSwitch.setAttribute("aria-label", t("Не спать"));
    function showKeepAwake(view) {
      document.getElementById("keep-awake").hidden = !view.shown;
      document.getElementById("keep-awake-cup").classList.toggle("holding", view.holding);
      const status = document.getElementById("keep-awake-status");
      status.textContent = view.status;
      status.className = view.holding ? "" : "secondary";
      keepAwakeSwitch.checked = view.manual;
      document.getElementById("keep-awake-release").hidden = !view.manual;
    }
    keepAwakeSwitch.onchange = async () => showKeepAwake(await invoke(keepAwakeSwitch.checked ? "keep_awake_hold" : "keep_awake_release", { minutes: null }));
    for (const button of document.querySelectorAll("#keep-awake [data-minutes]")) {
      button.onclick = async () => showKeepAwake(await invoke("keep_awake_hold", { minutes: Number(button.dataset.minutes) }));
    }
    document.getElementById("keep-awake-release").onclick = async () => showKeepAwake(await invoke("keep_awake_release"));
    const refreshKeepAwake = async () => showKeepAwake(await invoke("keep_awake_view"));
    refreshKeepAwake();
    window.__TAURI__.event.listen("keep-awake-changed", refreshKeepAwake);
    window.__TAURI__.event.listen("profiles-changed", refreshKeepAwake);
    // «держу ещё 47 мин» counts down.
    setInterval(() => { if (!document.getElementById("keep-awake").hidden) refreshKeepAwake(); }, 30_000);

    // STATUS.md items and attention texts carry inline Markdown: `code` and **bold**, as the Mac panel shows them.
    function inline(text) {
      const element = document.createElement("span");
      for (const part of text.split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
        if (!part) continue;
        const code = part.startsWith("`") && part.endsWith("`") && part.length > 1;
        const bold = part.startsWith("**") && part.endsWith("**") && part.length > 3;
        const piece = document.createElement(code ? "code" : bold ? "strong" : "span");
        piece.textContent = code ? part.slice(1, -1) : bold ? part.slice(2, -2) : part;
        element.append(piece);
      }
      return element;
    }

    function element(tag, className, text) {
      const item = document.createElement(tag);
      if (className) item.className = className;
      if (text !== undefined) item.textContent = text;
      return item;
    }

    function bullets(title, items, tint) {
      if (!items.length) return [];
      const box = element("div", `bullets ${tint ?? ""}`);
      box.append(element("div", "bullets-title", title));
      for (const item of items) {
        const line = element("div", "bullet");
        line.append(element("span", "secondary", "•"), inline(item));
        box.append(line);
      }
      return [box];
    }

    function action(title, onclick) {
      const button = element("button", "small", title);
      button.onclick = onclick;
      return button;
    }

    // The Claude block of an opened project, as on the Mac: three commands, the custom task's field, the result.
    // What it said stays per project while the panel lives.
    const launches = new Map();
    function claude(row) {
      const box = element("div", "claude");
      const state = launches.get(row.path) ?? {};
      const buttons = element("div", "actions");
      const start = async (command, task, allowBusy = false, mode = null, remember = false, agent = null, skipLimit = false) => {
        launches.set(row.path, { working: true });
        showProjects();
        let next;
        try {
          const reply = await invoke("launch_claude", { path: row.path, command, task: task ?? null, allowBusy, mode, remember, agent, skipLimit });
          next = reply.choose
            ? { choose: { question: reply.choose, command, task, allowBusy } }
            : { message: reply.message, confirm: reply.confirm ? { command, task, mode, agent, skipLimit } : null, limit: reply.limit ? { command, task, allowBusy } : null };
        } catch (error) {
          next = { message: String(error), error: true };
        }
        launches.set(row.path, next);
        showProjects();
      };
      // «На ночь» and «После сброса»: the run waits in the queue, the row in «Сессии» can cancel it.
      const later = async (command, task, when, agent = null) => {
        launches.set(row.path, { working: true });
        showProjects();
        let next;
        try {
          next = { message: await invoke("queue_launch", { path: row.path, command, task: task ?? null, when, agent }) };
        } catch (error) {
          next = { message: String(error), error: true };
        }
        launches.set(row.path, next);
        showProjects();
      };
      const nextStep = action(t("Следующий шаг"), () => start("next"));
      nextStep.classList.add("prominent");
      nextStep.title = row.nextHint;
      const custom = action(t("Своя задача…"), () => {
        launches.set(row.path, { ...state, editing: !state.editing });
        showProjects();
      });
      const finish = action(t("Завершить"), () => start("finish"));
      finish.title = t("Завершить сессию: проверки, коммит, push, PR и STATUS по разделу «Конец сессии»");
      const postpone = element("select", "service-choice");
      postpone.title = t("Следующий шаг — в фоне позже: ночью (утром сводка) или когда сбросится лимит сессии. Свою задачу — в «Своя задача…»");
      postpone.add(new Option(t("Позже"), ""));
      postpone.add(new Option(t("На ночь"), "night"));
      postpone.add(new Option(t("После сброса лимита"), "reset"));
      postpone.onchange = () => { const when = postpone.value; postpone.value = ""; if (when) later("next", null, when); };
      for (const button of [nextStep, custom, finish, postpone]) button.disabled = !!state.working;
      buttons.append(element("span", "bullets-title", "Claude"), nextStep, custom, finish, postpone);
      // «Открыть в…»: another installed agent in a terminal, in the project folder.
      if (otherAgents.length) {
        const open = element("select", "service-choice");
        open.title = t("Открыть другой агент в Терминале, в папке проекта");
        open.add(new Option(t("Открыть в…"), ""));
        for (const agent of otherAgents) open.add(new Option(agent.name, agent.id));
        open.onchange = () => {
          const agent = open.value;
          open.value = "";
          if (agent) invoke("open_agent", { path: row.path, agent }).catch((error) => { launches.set(row.path, { message: String(error), error: true }); showProjects(); });
        };
        buttons.append(open);
      }
      box.append(buttons);
      if (state.editing) {
        const editor = element("div", "task-editor");
        const field = element("textarea");
        field.rows = 3;
        field.placeholder = t("Что сделать в %@?", row.name);
        field.value = state.draft ?? "";
        field.oninput = () => { state.draft = field.value; launches.set(row.path, state); for (const button of [go, night, afterReset]) button.disabled = !field.value.trim(); };
        const cancel = action(t("Отмена"), () => { launches.set(row.path, {}); showProjects(); });
        // Who does it: Claude Code (where the profile says), or Codex in the background when it is installed.
        const codex = otherAgents.some((agent) => agent.id === "codex");
        const agent = element("select", "service-choice");
        agent.setAttribute("aria-label", t("Агент"));
        agent.add(new Option("Claude Code", ""));
        if (codex) agent.add(new Option(t("Codex в фоне"), "codex"));
        // The same task to both at once, each in its own worktree; one notification when both are done.
        if (codex) agent.add(new Option(t("И в Codex — сравнить"), "both"));
        agent.value = codex && ["codex", "both"].includes(state.agent) ? state.agent : "";
        const note = element("p", "secondary agent-note", t("Codex работает в фоне в своей песочнице: пишет в папке проекта, итог — уведомлением. Закрыта ли при этом сеть, на Windows зависит от того, как настроена песочница Codex."));
        note.hidden = agent.value !== "codex";
        agent.onchange = () => { state.agent = agent.value; launches.set(row.path, state); note.hidden = agent.value !== "codex"; };
        const both = async () => {
          const task = field.value;
          launches.set(row.path, { working: true });
          showProjects();
          let next;
          try { next = { message: (await invoke("launch_both", { path: row.path, task })).message }; } catch (error) { next = { message: String(error), error: true }; }
          launches.set(row.path, next);
          showProjects();
        };
        const send = () => (agent.value === "both" ? both() : start("custom", field.value, false, null, false, agent.value || null));
        const go = action(t("Запустить"), send);
        go.classList.add("prominent");
        const night = action(t("На ночь"), () => later("custom", field.value, "night", agent.value === "codex" ? "codex" : null));
        night.title = t("Запустить в фоне ночью; утром придёт сводка");
        const afterReset = action(t("После сброса"), () => later("custom", field.value, "reset", agent.value === "codex" ? "codex" : null));
        afterReset.title = t("Запустить в фоне, когда сбросится лимит сессии");
        for (const button of [go, night, afterReset]) button.disabled = !field.value.trim();
        field.onkeydown = (event) => {
          if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && field.value.trim()) send();
          if (event.key === "Escape") { event.stopPropagation(); cancel.onclick(); }
        };
        const line = element("div", "actions end");
        if (codex) line.append(agent);
        line.append(cancel, night, afterReset, go);
        editor.append(field, line, note);
        box.append(editor);
        setTimeout(() => field.focus(), 0);
      }
      // Where to run it, as the Mac asks: a terminal window (Claude can be answered) or the background.
      if (state.choose) {
        const chooser = element("div", "launch-message");
        chooser.append(element("strong", "", state.choose.question));
        const line = element("div", "actions");
        const remember = element("input");
        remember.type = "checkbox";
        const run = (mode) => start(state.choose.command, state.choose.task, state.choose.allowBusy, mode, remember.checked);
        const terminal = action(t("Терминал"), () => run("terminal"));
        terminal.title = t("Новое окно Терминала: видно, что делает Claude, можно отвечать на вопросы");
        const background = action(t("Фон"), () => run("background"));
        terminal.classList.add("prominent");
        background.classList.add("prominent");
        line.append(terminal, background, action(t("Отмена"), () => { launches.delete(row.path); showProjects(); }));
        const label = element("label", "remember");
        label.append(remember, element("span", "", t("Запомнить выбор")));
        chooser.append(line, label);
        box.append(chooser);
      }
      if (state.message) {
        const message = element("div", `launch-message${state.error ? " error" : ""}`);
        message.append(element("span", "", state.message));
        const line = element("div", "actions");
        if (state.confirm) line.append(action(t("Запустить всё равно"), () => start(state.confirm.command, state.confirm.task, true, state.confirm.mode, false, state.confirm.agent, state.confirm.skipLimit)));
        if (state.limit) {
          const waiting = state.limit;
          line.append(
            action(t("Запустить после сброса"), () => later(waiting.command, waiting.task, "reset")),
            action(t("Запустить сейчас"), () => start(waiting.command, waiting.task, waiting.allowBusy, "background", false, null, true)),
          );
          if (otherAgents.some((agent) => agent.id === "codex")) {
            const codex = action(t("В %@", "Codex"), () => start(waiting.command, waiting.task, waiting.allowBusy, "background", false, "codex"));
            codex.title = t("Claude близок к лимиту: ту же задачу выполнит Codex в фоне");
            line.append(codex);
          }
        }
        line.append(action(t("Скрыть"), () => { launches.delete(row.path); showProjects(); }));
        message.append(line);
        box.append(message);
      }
      return box;
    }

    // Removing a worktree, as on the Mac: «Удалить» checks first; when it is safe, «Удалить?» / «Отмена».
    const removals = new Map();
    function removal(row, worktree) {
      const state = removals.get(worktree.path) ?? {};
      const ask = async (remove) => {
        removals.set(worktree.path, { busy: true });
        showProjects();
        try {
          const reply = await invoke("worktree_removal", { path: row.path, worktree: worktree.path, remove });
          removals.set(worktree.path, reply.state === "confirm" ? { confirm: true } : reply.state === "blocked" ? { reason: reply.reason } : {});
        } catch (error) {
          removals.set(worktree.path, { reason: String(error) });
        }
        showProjects();
      };
      if (state.confirm) {
        const yes = action(t("Удалить?"), () => ask(true));
        yes.classList.add("danger");
        return [yes, action(t("Отмена"), () => { removals.delete(worktree.path); showProjects(); })];
      }
      const remove = action(t("Удалить"), () => ask(false));
      remove.title = t("Удалить worktree (только если нет незакоммиченного и ветка запушена)");
      remove.disabled = !!state.busy;
      return [remove];
    }

    // A project's details, as the Mac row opens: actions first, then STATUS, attention, PRs, worktrees.
    function details(row) {
      const box = element("div", "details");
      box.append(claude(row));
      const actions = element("div", "actions");
      actions.append(action(t("Терминал"), () => invoke("open_project", { path: row.path, target: "terminal" })));
      actions.append(action(t("Папка"), () => invoke("open_project", { path: row.path, target: "folder" })));
      if (row.github) actions.append(action("GitHub", () => invoke("open_link", { url: row.github })));
      box.append(actions);
      // A long «Stage» line would push the lists below out of sight: four lines, the whole text in the hint.
      if (row.stage) box.append(Object.assign(inline(row.stage), { className: "stage", title: row.stage }));
      box.append(...bullets(t("Сейчас"), row.now), ...bullets(t("Дальше"), row.next), ...bullets(t("Нужно от вас"), row.needs, "needs"));
      if (row.statusNote) box.append(element("p", "secondary", row.statusNote));
      for (const item of row.attention) {
        const line = element("div", `attention ${item.level}`);
        line.append(element("span", "mark", item.level === "high" ? "▲" : item.level === "mid" ? "●" : "ⓘ"), inline(item.text));
        box.append(line);
      }
      for (const pr of row.pullRequests) {
        const line = element("button", `pr link ci-${pr.ci}`);
        line.append(element("span", "mark", "⇄"), element("span", "secondary", `#${pr.number}`), element("span", "title", pr.title));
        if (pr.draft) line.append(element("span", "secondary", t("черновик")));
        line.title = `${pr.title} · CI: ${pr.ciTitle}`;
        line.disabled = !pr.url;
        line.onclick = () => invoke("open_link", { url: pr.url });
        box.append(line);
      }
      if (row.worktrees.length) {
        box.append(element("div", "bullets-title", "Worktree"));
        for (const worktree of row.worktrees) {
          const line = element("div", "worktree");
          const text = element("div", "worktree-text");
          text.append(element("div", "name", worktree.name), element("div", "secondary", worktree.detail));
          line.append(text, action(t("Терминал"), () => invoke("open_project", { path: worktree.path, target: "terminal" })));
          line.append(...removal(row, worktree));
          box.append(line);
          const state = removals.get(worktree.path);
          if (state?.reason) box.append(element("div", "worktree-blocked", state.reason));
        }
      }
      return box;
    }

    // Projects, as the Mac panel lists them: health dot, name, branch, badges, last activity; a click opens the rest.
    const expanded = new Set();
    // A stage on a colour that moves from blue (the first stage) to green (the last), as the Mac's StageChip.
    function stageChip(stage, index, count, selected = true) {
      const chip = element("span", selected ? "stage-chip selected" : "stage-chip", stage);
      const hue = index === null || index === undefined || count < 2 ? null : (0.6 - 0.27 * index / (count - 1)) * 360;
      chip.style.setProperty("--chip", hue === null ? "var(--secondary)" : `hsl(${Math.round(hue)} 45% 42%)`);
      return chip;
    }

    function folderDetails(row, view) {
      const stages = view.stages;
      const box = element("div", "details");
      if (stages.length) {
        box.append(element("div", "bullets-title", t("Этап")));
        const chips = element("div", "stage-chips");
        stages.forEach((stage, index) => {
          const button = element("button", "chip-button");
          button.append(stageChip(stage, index, stages.length, row.stage === stage));
          button.title = row.stage === stage ? t("Текущий этап") : t("Перевести на этап «%@» (пишется в проект.md)", stage);
          button.onclick = () => invoke("set_project_stage", { path: row.path, stage }).catch(showFolderError);
          chips.append(button);
        });
        box.append(chips);
      }
      if (row.format) box.append(element("div", "secondary", row.format));
      const actions = element("div", "actions");
      actions.append(action(t("Папка"), () => invoke("open_project", { path: row.path, target: "folder" })));
      if (row.mainFile) {
        const main = action(row.mainFile, () => invoke("open_project_file", { path: row.path, file: row.mainFile }));
        main.title = t("Главный файл — по нему считаются слова и хронометраж");
        actions.append(main);
      }
      if (row.cardFile) {
        actions.append(action(row.cardFile, () => invoke("open_project_file", { path: row.path, file: row.cardFile })));
      } else {
        const create = action(row.createCard, () => invoke("create_project_card", { path: row.path }).catch(showFolderError));
        create.title = t("Карточка проекта: этап, дедлайн, дата публикации, формат, главный файл");
        actions.append(create);
      }
      box.append(actions);
      box.append(...folderCommands(row, view));
      return box;
    }

    // The profile's commands on this project (Claude Code; the result is a new file here): a field first when the
    // command asks for something, then what is running or done.
    const asking = new Map();
    const chosenService = new Map();
    const comparing = new Map();
    function perform(row, command, text) {
      const compare = comparing.get(row.path);
      if (compare) {
        comparing.delete(row.path);
        return invoke("compare_folder_command", { path: row.path, command: command.id, text, services: [...compare] }).catch(showFolderError);
      }
      return invoke("run_folder_command", { path: row.path, command: command.id, text, service: chosenService.get(row.path) ?? null }).catch(showFolderError);
    }
    function folderCommands(row, view) {
      const head = element("div", "commands-head");
      head.append(element("span", "bullets-title", t("Команды")), element("span", "spacer"));
      const compare = comparing.get(row.path);
      if (view.services.length > 1 && !compare) {
        const service = element("select", "service-choice");
        service.title = t("Каким сервисом выполнять");
        for (const item of view.services) service.add(new Option(item.name, item.id));
        service.value = chosenService.get(row.path) ?? view.defaultService;
        service.onchange = () => chosenService.set(row.path, service.value);
        head.append(service);
      }
      if (view.services.length > 1) {
        const toggle = action(t("Сравнить"), () => {
          if (comparing.has(row.path)) comparing.delete(row.path); else comparing.set(row.path, new Set());
          showProjects();
        });
        toggle.title = t("Выполнить одну команду 2–3 сервисами и положить результаты рядом");
        toggle.setAttribute("aria-pressed", String(!!compare));
        if (compare) toggle.classList.add("pressed");
        head.append(toggle);
      }
      const parts = [head];
      if (compare) {
        const chips = element("div", "actions");
        for (const item of view.services) {
          const chip = action(item.name, () => {
            if (compare.has(item.id)) compare.delete(item.id); else if (compare.size < 3) compare.add(item.id);
            showProjects();
          });
          chip.setAttribute("aria-pressed", String(compare.has(item.id)));
          if (compare.has(item.id)) chip.classList.add("pressed");
          chips.append(chip);
        }
        parts.push(chips, element("div", "secondary", compare.size < 2 ? t("Выберите 2–3 сервиса, затем команду.") : t("Теперь выберите команду.")));
      }
      const buttons = element("div", "actions");
      for (const command of row.commands) {
        const button = action(command.title, () => {
          if (command.asks) {
            asking.set(row.path, command);
            showProjects();
          } else {
            perform(row, command, null);
          }
        });
