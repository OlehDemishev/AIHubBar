<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Hub Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>
      <h1>AI Hub Bar</h1>
      <span class="spacer"></span>
      <button class="icon-button" id="refresh" data-t-title="Обновить" aria-label="Refresh">↻</button>
      <button class="icon-button" id="settings" data-t-title="Настройки…" aria-label="Settings">⚙</button>
      <button class="icon-button" id="quit" data-t-title="Выйти из AI Hub Bar" aria-label="Quit">⏻</button>
    </header>
    <section class="card hint" id="tray-hint" hidden>
      <p data-t="Windows прячет новые значки под «^». Чтобы AI Hub Bar был всегда виден: Параметры → Персонализация → Панель задач → Другие значки на панели задач."></p>
      <p style="margin-top: 8px"><button id="tray-hint-done" data-t="Готово"></button></p>
    </section>
    <section class="card limits" aria-live="polite">
      <h2 data-t="Лимиты"></h2>
      <div class="rings" id="rings"></div>
      <div id="others"></div>
      <p class="secondary" id="forecast" hidden></p>
      <p class="error" id="limits-error" hidden></p>
    </section>
    <section class="card sessions">
      <h2 data-t="Сессии Claude Code"></h2>
      <div id="session-rows"></div>
      <p class="secondary" id="no-sessions" data-t="Сессий Claude Code сейчас нет" hidden></p>
      <div id="no-hooks" hidden>
        <p class="secondary" data-t="Сессии Claude не отслеживаются: hooks не установлены."></p>
        <p style="margin-top: 6px"><button id="hooks-settings" data-t="Настройки…"></button></p>
      </div>
    </section>
    <p class="secondary" id="version"></p>
  </main>
  <script type="module">
    import { loadTexts, invoke, t } from "./app.js";
    const ui = await loadTexts();
    document.getElementById("version").textContent = t("Версия %@", ui.version);
    document.getElementById("settings").onclick = () => invoke("open_settings");
    document.getElementById("quit").onclick = () => invoke("quit");
    document.getElementById("refresh").onclick = () => invoke("refresh_limits");
    const hint = document.getElementById("tray-hint");
    hint.hidden = !ui.showTrayHint;
    document.getElementById("tray-hint-done").onclick = async () => {
      await invoke("dismiss_tray_hint");
      hint.hidden = true;
    };
    window.addEventListener("keydown", (event) => { if (event.key === "Escape") invoke("hide_panel"); });

    // A limit as a ring, like the Mac panel: the used part from twelve o'clock, coloured by level.
    function ring(view) {
      const r = 15, length = 2 * Math.PI * r;
      const item = document.createElement("div");
      item.className = "ring";
      item.innerHTML = `
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
          <circle cx="20" cy="20" r="${r}" fill="none" stroke="${view.color}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${length * view.fraction} ${length}" transform="rotate(-90 20 20)"/>
        </svg>
        <div><div class="value"></div><div class="secondary title"></div><div class="secondary reset"></div></div>`;
      item.querySelector(".value").textContent = view.percent;
      item.querySelector(".value").style.color = view.color;
      item.querySelector(".title").textContent = view.title;
      item.querySelector(".reset").textContent = view.reset ?? "";
      return item;
    }

    async function showLimits() {
      const view = await invoke("limits_view");
      const rings = document.getElementById("rings");
      rings.replaceChildren(...[view.session, view.week].filter(Boolean).map(ring));
      const others = document.getElementById("others");
      others.replaceChildren(...view.others.map((other) => {
        const row = document.createElement("p");
        row.className = "secondary";
        row.textContent = `${other.title}: ${other.percent}`;
        return row;
      }));
      const forecast = document.getElementById("forecast");
      forecast.hidden = !view.forecast;
      forecast.textContent = view.forecast ?? "";
      const error = document.getElementById("limits-error");
      error.hidden = !view.error;
      error.textContent = view.error ?? "";
    }
    await showLimits();
    window.__TAURI__.event.listen("limits-changed", showLimits);

    // Sessions, as the Mac panel lists them: state, project, what it waits for or does, the task list's progress.
    async function showSessions() {
      const view = await invoke("sessions_view");
      const rows = document.getElementById("session-rows");
      rows.replaceChildren(...view.rows.map((row) => {
        const item = document.createElement("div");
        item.className = `session ${row.state}`;
        item.innerHTML = `<span class="dot" aria-hidden="true"></span><span class="project"></span><span class="secondary detail"></span><span class="secondary progress"></span>`;
        item.querySelector(".project").textContent = row.project;
        item.querySelector(".detail").textContent = row.detail ?? row.stateTitle;
        item.querySelector(".progress").textContent = row.progress ?? "";
        item.title = `${row.project} · ${row.stateTitle}${row.detail ? " · " + row.detail : ""}`;
        return item;
      }));
      document.getElementById("no-hooks").hidden = view.hooks === "installed";
      document.getElementById("no-sessions").hidden = view.rows.length > 0 || view.hooks !== "installed";
    }
    document.getElementById("hooks-settings").onclick = () => invoke("open_settings");
    await showSessions();
    window.__TAURI__.event.listen("sessions-changed", showSessions);
  </script>
</body>
</html>
