        button.title = command.hint;
        button.disabled = !!compare && compare.size < 2;
        buttons.append(button);
      }
      parts.push(buttons);
      const waiting = asking.get(row.path);
      if (waiting) {
        const form = element("div", "new-project-form");
        const input = element("input");
        input.type = "text";
        input.placeholder = waiting.asks;
        const run = async () => {
          if (!input.value.trim()) return;
          asking.delete(row.path);
          await perform(row, waiting, input.value);
          showProjects();
        };
        input.addEventListener("keydown", (event) => { if (event.key === "Enter") run(); });
        form.append(input, action(t("Запустить"), run), action(t("Отмена"), () => { asking.delete(row.path); showProjects(); }));
        parts.push(form);
        setTimeout(() => input.focus(), 0);
      }
      if (row.noText) parts.push(element("div", "secondary", t("В папке нет текстового файла — команды получат только папку.")));
      for (const job of row.jobs) {
        const line = element("div", `job ${job.state}`);
        line.append(element("span", "mark", { running: "◌", done: "✓", failed: "⚠", terminal: "›_" }[job.state]), element("span", "title", job.title));
        if (job.result) {
          const open = action(job.result, () => invoke("open_project_file", { path: row.path, file: job.result }));
          line.append(open);
        } else {
          const text = job.state === "running" ? t("выполняется…") : job.message ?? "";
          line.append(Object.assign(element("span", "secondary note", text), { title: text }));
        }
        parts.push(line);
      }
      if (row.jobs.some((job) => job.state !== "running")) {
        const clear = action(t("Убрать готовые"), () => invoke("clear_finished_jobs", { path: row.path }));
        clear.classList.add("clear-jobs");
        parts.push(clear);
      }
      return parts;
    }

    function showFolderError(error) {
      const message = document.getElementById("projects-message");
      message.hidden = false;
      message.textContent = String(error);
    }

    // Folder projects (a profile with «папки»): stage chip and metrics; opened — stages, files, the card.
    function folderRows(view) {
      return view.rows.map((row) => {
        const item = element("div", "project folder");
        item.dataset.search = row.path;
        const open = expanded.has(row.path);
        const summary = element("button", "project-summary");
        summary.setAttribute("aria-expanded", String(open));
        summary.title = open ? t("Свернуть") : t("Подробнее и действия");
        const text = element("span", "folder-text");
        const top = element("span", "folder-top");
        top.append(element("span", "name", row.name), element("span", "spacer"));
        if (row.stage) top.append(stageChip(row.stage, row.stageIndex, view.stages.length));
        text.append(top);
        if (row.metrics || row.overdue) {
          const line = element("span", "folder-metrics secondary", row.metrics);
          if (row.overdue) line.append(element("span", "overdue", (row.metrics ? " · " : "") + row.overdue));
          text.append(line);
        }
        summary.append(text);
        summary.onclick = () => {
          if (expanded.has(row.path)) expanded.delete(row.path); else expanded.add(row.path);
          showProjects();
        };
        item.append(summary);
        if (open) item.append(folderDetails(row, view));
        return item;
      });
    }

    const newProject = document.getElementById("new-project");
    const newProjectForm = document.getElementById("new-project-form");
    const newProjectName = document.getElementById("new-project-name");
    const newProjectError = document.getElementById("new-project-error");
    function closeNewProject() {
      newProjectForm.hidden = true;
      document.getElementById("new-project-open").hidden = false;
      newProjectName.value = "";
      newProjectError.hidden = true;
    }
    document.getElementById("new-project-open").onclick = () => {
      newProjectForm.hidden = false;
      document.getElementById("new-project-open").hidden = true;
      newProjectName.focus();
    };
    document.getElementById("new-project-cancel").onclick = closeNewProject;
    async function createProject() {
      if (!newProjectName.value.trim()) return;
      try {
        const path = await invoke("create_folder_project", { name: newProjectName.value });
        expanded.add(path);
        closeNewProject();
      } catch (error) {
        newProjectError.hidden = false;
        newProjectError.textContent = String(error);
      }
    }
    document.getElementById("new-project-create").onclick = createProject;
    newProjectName.addEventListener("keydown", (event) => { if (event.key === "Enter") createProject(); });

    // «Ближайшее»: the next 7 days of every profile with a calendar, overdue in red; a click opens it.
    async function showUpcoming() {
      const view = await invoke("upcoming_view");
      document.getElementById("upcoming").hidden = !view.active;
      document.getElementById("upcoming-empty").hidden = view.rows.length > 0;
      const more = document.getElementById("upcoming-more");
      more.hidden = !view.more;
      more.textContent = view.more ?? "";
      document.getElementById("upcoming-rows").replaceChildren(...view.rows.map((row) => {
        const line = element("button", row.overdue ? "upcoming-row overdue" : "upcoming-row");
        line.title = row.hint;
        line.append(element("span", "mark", { deadline: "⚑", publish: "➤", plan: "▦" }[row.kind]), element("span", "title", row.title));
        if (row.detail) line.append(element("span", "secondary detail", row.detail));
        line.append(element("span", "spacer"), element("span", "when", row.when));
        line.onclick = () => invoke("open_upcoming", { id: row.id });
        return line;
      }));
    }
    document.getElementById("open-calendar").onclick = () => invoke("open_calendar");
    showUpcoming();
    window.__TAURI__.event.listen("calendar-changed", showUpcoming);
    window.addEventListener("focus", showUpcoming);

    let otherAgents = [];
    async function showProjects() {
      const view = await invoke("projects_view");
      otherAgents = view.agents ?? [];
      (window.searchData ??= {}).folders = !!view.folders;
      (window.searchData ??= {}).projects = view.folders
        ? view.folders.rows.map((row) => ({ id: row.path, name: row.name, detail: "" }))
        : view.rows.map((row) => ({ id: row.path, name: row.name, detail: row.branch ?? "" }));
      const rows = document.getElementById("project-rows");
      newProject.hidden = !view.folders?.canCreate;
      // «Цель по словам» of a folder profile: today's words against the goal, and the days in a row.
      const goal = view.folders?.wordGoal;
      const goalLine = document.getElementById("word-goal");
      goalLine.hidden = !goal;
      if (goal) {
        goalLine.classList.toggle("reached", goal.reached);
        goalLine.querySelector(".mark").textContent = goal.reached ? "✓" : "✎";
        goalLine.querySelector(".text").textContent = goal.text;
        goalLine.querySelector(".streak").textContent = goal.streak ?? "";
        goalLine.querySelector(".word-goal-bar span").style.width = `${Math.round(goal.fraction * 100)}%`;
      }
      if (view.folders) {
        rows.replaceChildren(...folderRows(view.folders));
        const message = document.getElementById("projects-message");
        message.hidden = !view.message;
        message.textContent = view.message ?? "";
        return;
      }
      rows.replaceChildren(...view.rows.map((row) => {
        const item = element("div", "project");
        item.dataset.search = row.path;
        const open = expanded.has(row.path);
        const summary = element("button", "project-summary");
        summary.setAttribute("aria-expanded", String(open));
        summary.title = open ? t("Свернуть") : t("Подробнее и действия");
        const dot = element("span", `dot ${row.health}`);
        dot.title = row.healthTitle;
        dot.setAttribute("aria-label", row.healthTitle);
        summary.append(dot, element("span", "name", row.name));
        if (row.branch) summary.append(element("span", "secondary branch", `⎇ ${row.branch}`));
        summary.append(element("span", "spacer"));
        if (row.dirty) summary.append(Object.assign(element("span", "badge dirty", `✎ ${row.dirty}`), { title: row.dirtyTitle }));
        if (row.prs) summary.append(Object.assign(element("span", `badge ci-${row.prsCi}`, `⇄ ${row.prs}`), { title: row.prsTitle }));
        if (row.ago) summary.append(element("span", "secondary ago", row.ago));
        summary.onclick = () => {
          if (expanded.has(row.path)) expanded.delete(row.path); else expanded.add(row.path);
          showProjects();
        };
        item.append(summary);
        if (open) item.append(details(row));
        return item;
      }));
      const message = document.getElementById("projects-message");
      message.hidden = !view.message;
      message.textContent = view.message ?? "";
    }
    await showProjects();
    window.__TAURI__.event.listen("projects-changed", showProjects);
    window.addEventListener("focus", () => invoke("projects_panel_opened"));
  </script>
</body>
</html>
