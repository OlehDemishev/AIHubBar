<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Hub Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Laid out like the Mac's Settings (docs/specs/SPEC-settings.md §5b): a sidebar with a search and a row per area,
       the chosen page on the right. A module's page and «Telegram» open from a row of another page and go back to it. -->
  <div class="settings-split">
    <nav class="settings-sidebar">
      <input type="search" id="settings-search" autocomplete="off" spellcheck="false" data-t-placeholder="Поиск">
      <div id="settings-nav" class="settings-nav" role="tablist" aria-orientation="vertical"></div>
      <p class="secondary" id="settings-nothing" data-t="Ничего не найдено" hidden></p>
      <p class="secondary" id="version"></p>
    </nav>
    <main class="settings" id="settings-main">
      <header class="pane-header">
        <button id="pane-back" class="pane-back" hidden><span aria-hidden="true">‹</span></button>
        <span class="pane-icon" id="pane-icon" aria-hidden="true"></span>
        <div class="pane-title">
          <h1 id="pane-title"></h1>
          <p class="secondary" id="pane-subtitle"></p>
        </div>
        <input type="checkbox" class="switch" id="pane-switch" data-t-title="Включить модуль" hidden>
      </header>

      <div class="page" id="page-general" role="tabpanel" hidden>
        <section class="card">
          <div class="row">
            <label for="language" data-t="Язык интерфейса"></label>
            <select id="language"></select>
          </div>
          <div class="row">
            <label for="autostart" data-t="Запускать при входе в систему"></label>
            <input type="checkbox" id="autostart">
          </div>
        </section>
        <section class="card" id="telegram" hidden>
          <div class="row">
            <span>Telegram</span>
            <button data-open="telegram" data-t="Открыть"></button>
          </div>
        </section>
        <h2 class="group" data-t="Уведомления"></h2>
        <section class="card">
          <div class="row">
            <label for="reminders" data-t="Напоминать"></label>
            <select id="reminders"></select>
          </div>
          <div class="row">
            <label for="pr-alerts" data-t="Уведомлять, когда CI упал или починился и когда PR закрыт"></label>
            <input type="checkbox" id="pr-alerts">
          </div>
        </section>
        <div id="updates" class="group-block" hidden>
          <h2 class="group" data-t="Обновления"></h2>
          <section class="card">
            <div class="row">
              <label for="updates-daily" data-t="Проверять раз в день"></label>
              <input type="checkbox" id="updates-daily">
            </div>
            <div class="row">
              <span id="updates-state" class="secondary"></span>
              <span>
                <button id="updates-install" data-t="Установить и перезапустить" hidden></button>
                <button id="updates-check" data-t="Проверить сейчас"></button>
              </span>
            </div>
          </section>
        </div>
        <h2 class="group" data-t="Обратная связь"></h2>
        <section class="card">
          <div class="row">
            <span data-t="Обратная связь"></span>
            <span>
              <button id="feedback-idea" data-t="Предложить идею…"></button>
              <button id="feedback-problem" data-t="Сообщить о проблеме…"></button>
            </span>
          </div>
          <p class="secondary" data-t="Откроется форма на GitHub, версия и система в ней уже заполнены. Сама программа ничего не отправляет: перед отправкой видно всё, что уходит. Нужен аккаунт GitHub."></p>
        </section>
        <h2 class="group" data-t="Перенос и обмен"></h2>
        <section class="card">
          <div class="row">
            <span data-t="Все настройки и профили"></span>
            <span>
              <button id="export-settings" data-t="Экспорт настроек…"></button>
              <button id="import" data-t="Импорт…"></button>
            </span>
          </div>
          <div class="import-pending" id="import-pending" hidden>
            <strong id="import-title"></strong>
            <p class="secondary" id="import-summary"></p>
            <p>
              <button id="import-replace" data-t="Заменить все настройки"></button>
              <button id="import-add" data-t="Добавить профили"></button>
              <button id="import-cancel" data-t="Отмена"></button>
            </p>
          </div>
          <p class="secondary import-message" hidden></p>
        </section>
      </div>

      <div class="page" id="page-telegram" role="tabpanel" hidden>
        <section class="card">
          <div class="row">
            <span data-t="Токен бота"></span>
            <span class="telegram-controls">
              <span class="secondary" id="telegram-bot"></span>
              <input type="password" id="telegram-token" placeholder="123456:ABC…" autocomplete="off" spellcheck="false" data-t-title="Токен бота">
              <button id="telegram-save" data-t="Сохранить"></button>
              <button id="telegram-remove" data-t="Удалить" hidden></button>
            </span>
          </div>
          <div class="row">
            <span data-t="Чат"></span>
            <span class="telegram-controls">
              <span class="secondary" id="telegram-chat"></span>
              <input type="text" id="telegram-chat-id" inputmode="numeric" autocomplete="off" hidden>
              <button id="telegram-chat-save" data-t="Сохранить" hidden></button>
              <button id="telegram-cancel" data-t="Отмена" hidden></button>
              <button id="telegram-unbind" data-t="Отвязать" hidden></button>
              <button id="telegram-bind" data-t="Привязать чат" data-t-title="Откроется бот в Telegram — нажмите «Start», и бот будет отвечать только этому чату"></button>
            </span>
          </div>
          <div class="row">
            <label for="telegram-answers" data-t="Этот компьютер отвечает боту" data-t-title="Только один компьютер читает сообщения бота; уведомления присылают все"></label>
            <span class="telegram-controls">
              <span class="secondary" id="telegram-reading"></span>
              <input type="checkbox" id="telegram-answers">
            </span>
          </div>
          <div class="row">
            <label for="telegram-requests" data-t="Запросы разрешений в этот бот" data-t-title="Когда Claude просит разрешение, бот присылает запрос с кнопками «Разрешить», «Отклонить», «Подробнее»"></label>
            <input type="checkbox" id="telegram-requests">
          </div>
          <div class="row">
            <span class="secondary" id="telegram-status"></span>
            <button id="telegram-test" data-t="Проверить"></button>
          </div>
        </section>
        <h2 class="group" data-t="Уведомления в Telegram"></h2>
        <section class="card" id="telegram-events"></section>
      </div>

      <div class="page" id="page-show" role="tabpanel" hidden>
        <section class="card show-list">
          <div class="show-row">
            <button class="show-open" data-open="module.resources">
              <strong data-t="Ресурсы компьютера"></strong>
              <span class="secondary" data-t="Процессор, память, диск, сеть, батарея и самые прожорливые приложения; уведомления о нагрузке, памяти, месте и заряде."></span>
            </button>
            <input type="checkbox" class="switch" id="module-resources">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.keepAwake">
              <strong data-t="Не спать"></strong>
              <span class="secondary" data-t="Компьютер не засыпает, пока работает Claude, на время, при подключённом питании или мониторе, пока открыты выбранные приложения."></span>
            </button>
            <input type="checkbox" class="switch" id="module-keep-awake">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.quickCommands">
              <strong data-t="Быстрые команды"></strong>
              <span class="secondary" data-t="Свои кнопки: скрипт в фоне или в Терминале, ссылка, файл, папка или программа."></span>
            </button>
            <input type="checkbox" class="switch" id="module-quick-commands">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.toggles">
              <strong data-t="Быстрые переключатели"></strong>
              <span class="secondary" data-t="Тёмная тема, значки на рабочем столе, блокировка и выключение экрана, корзина — в один клик."></span>
            </button>
            <input type="checkbox" class="switch" id="module-toggles">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.clipboard">
              <strong data-t="История буфера"></strong>
              <span class="secondary" data-t="Последние копирования: поиск, закрепление, снова в буфер одним кликом. Пароли из менеджеров паролей не запоминаются."></span>
            </button>
            <input type="checkbox" class="switch" id="module-clipboard">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.notes">
              <strong data-t="Заметки"></strong>
              <span class="secondary" data-t="Заметки в Markdown прямо в панели: вкладки, обычные файлы .md в папке, которую откроет любой редактор."></span>
            </button>
            <input type="checkbox" class="switch" id="module-notes">
          </div>
          <div class="show-row">
            <button class="show-open" data-open="module.quickPrompt">
              <strong data-t="Быстрый запрос"></strong>
              <span class="secondary" data-t="Горячая клавиша в любом приложении открывает окно: задача, проект и агент — и она уходит в фон или в новое окно Терминала."></span>
            </button>
            <input type="checkbox" class="switch" id="module-quick-prompt">
          </div>
        </section>
      </div>

      <div class="page" id="page-module.resources" data-switch="module-resources" role="tabpanel" hidden>
        <section class="card" id="resource-options" hidden>
          <h3 data-t="Уведомления о ресурсах"></h3>
          <label class="check-line"><input type="checkbox" id="resource-alerts"> <span data-t="Уведомлять о нагрузке, памяти, месте и заряде"></span></label>
          <div class="row">
            <label for="resource-disk" data-t="Мало места — свободно меньше"></label>
            <select id="resource-disk"></select>
          </div>
          <p class="secondary" data-t="Процессор выше 90 % дольше 5 минут, критическая нехватка памяти, мало места, заряд ниже 15 % без зарядки — по одному уведомлению, пока не наладится."></p>
        </section>
      </div>

      <div class="page" id="page-module.keepAwake" data-switch="module-keep-awake" role="tabpanel" hidden>
        <section class="card" id="keep-awake-rules" hidden>
          <h3 data-t="Правила «Не спать»"></h3>
          <label class="check-line"><input type="checkbox" data-rule="whileClaudeWorks"> <span data-t="Пока работает Claude (сессия или фоновая задача)"></span></label>
          <label class="check-line"><input type="checkbox" data-rule="whileOnPower"> <span data-t="Пока подключено питание"></span></label>
          <label class="check-line"><input type="checkbox" data-rule="whileExternalDisplay"> <span data-t="Пока подключён внешний монитор"></span></label>
          <div class="row">
            <span data-t="Пока открыты приложения"></span>
            <span class="apps-line">
              <span class="secondary" id="keep-awake-apps"></span>
              <button id="keep-awake-choose" data-t="Выбрать…"></button>
              <button id="keep-awake-clear" data-t="Очистить" hidden></button>
            </span>
          </div>
          <label class="check-line"><input type="checkbox" data-rule="keepDisplayOn"> <span data-t="Не гасить и экран"></span></label>
          <p class="secondary" data-t="Любое сработавшее правило не даёт компьютеру уснуть; вручную — переключателем и таймерами в панели. Системные настройки не меняются: как только правил нет, компьютер засыпает как обычно. Внешний монитор — второй экран ноутбука или любой экран компьютера без батареи."></p>
        </section>
      </div>

      <div class="page" id="page-module.quickCommands" data-switch="module-quick-commands" role="tabpanel" hidden>
        <section class="card" id="quick-library" hidden>
          <h3 data-t="Команды"></h3>
          <div id="quick-editors"></div>
          <button id="quick-add" data-t="Добавить команду"></button>
          <p class="secondary" data-t="Скрипт в фоне запускается в домашней папке (PowerShell на Windows, sh на Linux), итог приходит уведомлением; «в Терминале» — открывает новое окно. Открыть — ссылка (https://…) или путь (~/…)."></p>
        </section>
      </div>

      <div class="page" id="page-module.toggles" data-switch="module-toggles" role="tabpanel" hidden>
        <section class="card" id="toggle-options" hidden>
          <h3 data-t="Какие переключатели показывать"></h3>
          <div id="toggle-choices"></div>
          <p class="secondary" data-t="Корзина очищается только после подтверждения."></p>
        </section>
      </div>

      <div class="page" id="page-module.clipboard" data-switch="module-clipboard" role="tabpanel" hidden>
        <section class="card" id="clipboard-options" hidden>
          <div class="row">
            <label for="clipboard-limit" data-t="Хранить последних"></label>
            <select id="clipboard-limit"></select>
          </div>
          <div class="row">
            <label for="clipboard-remember" data-t="Помнить после перезапуска"></label>
            <input type="checkbox" class="switch" id="clipboard-remember">
          </div>
          <div class="row">
            <span data-t="Не запоминать из приложений"></span>
            <span>
              <button class="link" id="clipboard-excluded-toggle" data-t-title="Показать приложения"></button>
              <button id="clipboard-excluded-add" data-t="Добавить…"></button>
              <button id="clipboard-excluded-reset" data-t="По умолчанию"></button>
            </span>
          </div>
          <div id="clipboard-excluded" hidden></div>
        </section>
      </div>

      <div class="page" id="page-module.notes" data-switch="module-notes" role="tabpanel" hidden>
        <section class="card" id="notes-options" hidden>
          <div class="row">
            <span data-t="Папка"></span>
            <span class="secondary notes-folder" id="notes-folder"></span>
            <button id="notes-choose" data-t="Выбрать…"></button>
            <button id="notes-open-folder" data-t="Открыть папку"></button>
          </div>
          <p class="secondary" data-t="Каждая заметка — файл .md в этой папке; удалённые уходят в корзину."></p>
        </section>
      </div>

      <div class="page" id="page-module.quickPrompt" data-switch="module-quick-prompt" role="tabpanel" hidden>
        <section class="card" id="quick-prompt-options" hidden>
          <div class="row">
            <label for="quick-prompt-key" data-t="Горячая клавиша"></label>
            <select id="quick-prompt-key"></select>
          </div>
          <div class="row">
            <span data-t="Окно быстрого запроса"></span>
            <button id="quick-prompt-open" data-t="Открыть"></button>
          </div>
          <p class="secondary" data-t="Проект — тот, что в заголовке окна впереди, иначе прошлый. Claude Code и Codex — в фоне или в Терминале; другие агенты открываются в Терминале, задача — в буфере обмена. Из скрипта: claudepult --app-command quick-prompt."></p>
        </section>
      </div>

      <div class="page" id="page-appearance" role="tabpanel" hidden>
        <section class="card">
          <div class="row">
            <label for="theme" data-t="Тема"></label>
            <select id="theme"></select>
          </div>
          <div class="row">
            <label for="text-size" data-t="Размер текста"></label>
            <select id="text-size"></select>
          </div>
          <div class="row">
            <label for="panel-width" data-t="Ширина"></label>
            <select id="panel-width"></select>
          </div>
          <div class="row">
            <label for="panel-density" data-t="Плотность строк"></label>
            <select id="panel-density"></select>
          </div>
        </section>
        <section class="card services">
          <h2 data-t="Значок в трее"></h2>
          <div id="tray-styles" class="tray-styles" role="radiogroup"></div>
          <p class="secondary" data-t="На значке — первые два лимита главного сервиса: у Claude это сессия и неделя. Цвет каждого — по его уровню. Образцы показаны для 62 % и 31 %."></p>
        </section>
      </div>

      <div class="page" id="page-services" role="tabpanel" hidden>
        <!-- A page per service, as on the Mac: the capsules choose whose blocks and rows are seen (`data-service`). -->
        <div class="service-tabs" id="service-tabs" role="tablist"></div>
        <section class="card services">
          <div class="card-title">
            <h2 data-t="Агенты"></h2>
            <button id="agents-refresh" data-t="Обновить"></button>
          </div>
          <div id="agent-rows"></div>
        </section>
        <h2 class="group" data-service="claude codex copilot">Hooks</h2>
        <section class="card" data-service="claude">
          <div class="row">
            <span data-t="Сессии Claude Code"></span>
            <strong id="hooks-status"></strong>
          </div>
          <div class="row">
            <span class="secondary" id="hooks-path"></span>
            <span>
              <button id="hooks-install"></button>
              <button id="hooks-remove" data-t="Удалить"></button>
            </span>
          </div>
          <p class="secondary" style="margin-top: 8px" data-t="Hooks добавляются в settings.json Claude Code (остальные настройки не трогаются, перед изменением рядом сохраняется копия). Они записывают состояние каждой сессии Claude Code на этом компьютере, чтобы AI Hub Bar показывал их в панели."></p>
          <p class="error" id="hooks-error" hidden></p>
        </section>
        <section class="card agent-hooks" data-agent="codex" data-service="codex">
          <div class="row">
            <span data-t="Состояние сессий Codex"></span>
            <strong class="status"></strong>
          </div>
          <div class="row">
            <span class="secondary path"></span>
            <span><button class="install"></button> <button class="remove" data-t="Удалить"></button></span>
          </div>
          <p class="secondary note" style="margin-top: 8px" hidden></p>
          <p class="error" hidden></p>
        </section>
        <section class="card agent-hooks" data-agent="copilot" data-service="copilot">
          <div class="row">
            <span data-t="Состояние сессий Copilot"></span>
            <strong class="status"></strong>
          </div>
          <div class="row">
            <span class="secondary path"></span>
            <span><button class="install"></button> <button class="remove" data-t="Удалить"></button></span>
          </div>
          <p class="error" hidden></p>
        </section>
        <section class="card" id="claude-accounts" data-service="claude">
          <h2 data-t="Другие аккаунты Claude"></h2>
          <div id="claude-account-rows"></div>
          <p style="margin-top: 8px"><button id="claude-account-add" data-t="Добавить аккаунт…"></button> <button id="claude-account-refresh" data-t="Обновить"></button></p>
          <p class="error" id="claude-account-note" hidden></p>
          <p class="secondary" data-t="Основной аккаунт настраивать не нужно. Для другого выберите его папку настроек (CLAUDE_CONFIG_DIR) и нажмите «Войти»: его лимиты появятся в панели. Прогноза и истории у таких аккаунтов нет."></p>
        </section>
        <section class="card services">
          <h2 data-t="Другие AI"></h2>
          <div data-service="claude">
          <div class="row">
            <label for="main-service" data-t="Главный сервис"></label>
            <select id="main-service"></select>
          </div>
          <p class="secondary" data-t="Лимиты главного сервиса идут первыми в панели и показаны на значке в трее. «Автоматически» — Claude, а без него первый сервис, у которого есть лимиты."></p>
          <div class="row">
            <label for="limit-thresholds" data-t="Уведомлять на, %"></label>
            <input type="text" id="limit-thresholds" placeholder="50, 80, 95" inputmode="numeric" autocomplete="off" style="width: 9em">
          </div>
          <div class="row">
            <label for="run-guard" data-t="Ставить фоновые задачи на паузу"></label>
            <select id="run-guard"></select>
          </div>
          <p class="secondary" data-t="Когда сессия или неделя дошла до порога, фоновые задачи замирают там, где были, а запланированные ждут. После сброса лимита работа продолжается сама. Так задача не обрывается на полпути из-за лимита."></p>
          <div class="row">
            <label for="renew-login" data-t="Продлевать вход Claude Code сам"></label>
            <input type="checkbox" id="renew-login">
          </div>
          <p class="secondary" data-t="Когда вход истёк (claude давно не запускался, а работа идёт в приложении Claude), AI Hub Bar отправляет через claude запрос из одного слова — самая маленькая модель, без инструментов, не чаще раза в час. Вход продлевается примерно на 8 часов."></p>
          </div>
          <div id="hub-sources"></div>
        </section>
        <h2 class="group" data-t="Фоновые задачи" data-service="claude"></h2>
        <section class="card" data-service="claude">
          <div class="row">
            <label for="time-limit" data-t="Лимит времени"></label>
            <select id="time-limit"></select>
          </div>
          <div class="row">
            <label for="night-hour" data-t="Ночные задачи начинаются в"></label>
            <select id="night-hour"></select>
          </div>
        </section>
        <section class="card services">
          <h2 data-t="Модели по API"></h2>
          <p class="secondary" id="no-key-store" data-t="На этой системе ключи API пока негде хранить: работают только серверы без ключа (Ollama, LM Studio)." hidden></p>
          <div id="provider-rows"></div>
        </section>
        <section class="card services" data-service="other">
          <h2 data-t="Расход по API"></h2>
          <div class="row"><span data-t="Сегодня"></span><span id="spend-today"></span></div>
          <div class="row"><span data-t="В этом месяце"></span><span id="spend-month"></span></div>
          <div class="row">
            <label for="api-budget" data-t="Бюджет в месяц, $"></label>
            <input type="number" id="api-budget" min="0" step="1" data-t-placeholder="нет">
          </div>
          <div id="price-rows"></div>
          <p class="secondary" data-t="AI Hub Bar считает токены своих запросов по ответам сервисов; стоимость — по ценам, которые вы введёте (цены меняются, поэтому они не зашиты). Уведомление при 80 % и 100 % бюджета."></p>
        </section>
        <section class="card" data-service="claude">
          <h2 data-t="CLAUDE.md и MCP"></h2>
          <p><button id="open-claude-config" data-t="Открыть инструкции и MCP-серверы…"></button></p>
          <p class="secondary" data-t="Отдельное окно: все CLAUDE.md и AGENTS.md (общие и проектов) с поиском и правкой, и MCP-серверы Claude Code с выключателем."></p>
        </section>
        <section class="card" data-service="claude">
          <h2 data-t="Свои промпты"></h2>
          <div id="saved-prompts"></div>
          <p><button id="saved-prompt-add" data-t="Добавить промпт"></button></p>
          <p class="secondary" data-t="Наберите название в поиске, выберите проект — Claude запустится с этим текстом. Подстановки: {проект}, {ветка}."></p>
        </section>
      </div>

      <div class="page" id="page-modes" role="tabpanel" hidden>
        <section class="card">
          <div id="profile-rows"></div>
          <div class="row">
            <span class="secondary" id="profile-delete-note" data-t="Настройки профиля пропадут. Папки проектов останутся на месте." hidden></span>
            <span class="profile-add">
              <select id="profile-template" data-t-title="Добавить профиль из шаблона"></select>
              <button id="profile-add" data-t="Добавить профиль"></button>
              <button id="profile-assistant" data-t="Помощник…"></button>
            </span>
          </div>
        </section>
        <section class="card">
          <div class="card-title">
            <h2 id="current-profile"></h2>
            <button id="export-profile" data-t="Экспорт профиля…"></button>
          </div>
          <p class="secondary import-message" hidden></p>
          <div class="folder">
            <div class="row">
              <span data-t="Папка проектов"></span>
              <span>
                <button id="projects-folder-reset" data-t="По умолчанию" hidden></button>
                <button id="projects-folder-choose" data-t="Выбрать…"></button>
              </span>
            </div>
            <p class="secondary path" id="projects-folder-path"></p>
            <p class="error" id="projects-folder-note" hidden></p>
          </div>
          <div class="row">
            <label for="launch-mode" data-t="Где запускать Claude"></label>
            <select id="launch-mode"></select>
          </div>
          <div class="row" id="calendar-row" hidden>
            <label for="profile-calendar" data-t="Календарь"></label>
            <select id="profile-calendar"></select>
          </div>
          <div class="row">
            <label for="profile-service" data-t="Сервис по умолчанию"></label>
            <select id="profile-service"></select>
          </div>
          <p class="secondary" data-t="Сервис команд-шаблонов профиля. Агенты и ключи — Настройки → «Сервисы AI»."></p>
          <div id="profile-folder-fields" hidden>
            <div class="row">
              <label for="profile-permissions" data-t="Права Claude в фоне"></label>
              <select id="profile-permissions"></select>
            </div>
            <h3 data-t="Карточка, этапы и метрики"></h3>
            <div class="row">
              <label for="profile-stages" data-t="Этапы"></label>
              <input type="text" id="profile-stages" class="wide" data-t-placeholder="идея, черновик, готово">
            </div>
            <div class="metric-boxes" id="profile-metrics"></div>
            <div class="row" id="profile-goal-row">
              <label for="profile-goal" id="profile-goal-label"></label>
              <input type="number" id="profile-goal" min="0" max="20000" step="100">
            </div>
            <div class="row" id="profile-pace-row" hidden>
              <label for="profile-pace" id="profile-pace-label"></label>
              <input type="number" id="profile-pace" min="80" max="250" step="10">
            </div>
            <p class="secondary" data-t="Карточка проекта — файл проект.md в папке проекта (этап, дедлайн, публикация, формат, главный файл, площадка); этап меняется прямо из панели. Слова считаются по главному файлу."></p>
            <h3 data-t="Команды проектов"></h3>
            <div id="profile-commands"></div>
            <button id="command-add" data-t="Добавить команду"></button>
            <p class="secondary" data-t="Подстановки: {проект} {файл} {формат} {площадка} {хронометраж} {текст} {язык}; в имени файла ещё <время> и <файл>. Результат — всегда новый файл в папке проекта. «Своя задача» есть всегда."></p>
          </div>
        </section>
      </div>

      <div class="page" id="page-shortcuts" role="tabpanel" hidden>
        <section class="card">
          <div class="row">
            <label for="search-key" data-t="Открывать поиск с клавиатуры"></label>
            <select id="search-key"></select>
          </div>
          <div class="row">
            <span data-t="Быстрый запрос"></span>
            <button data-open="module.quickPrompt" data-t="Открыть"></button>
          </div>
          <div class="row">
            <span data-t="Быстрые команды"></span>
            <button data-open="module.quickCommands" data-t="Открыть"></button>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module">
    import { loadTexts, invoke, t } from "./app.js";
    const ui = await loadTexts();
    document.getElementById("version").textContent = t("Версия %@", ui.version);

    // The pages. An area has a row in the sidebar; a module's page and «Telegram» open from a row of their parent
    // and go back to it (Alt+←). The page on screen is remembered, as on the Mac.
    const icons = {
      general: '<circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/>',
      show: '<rect x="2.5" y="2.5" width="11" height="3.2" rx="1"/><rect x="2.5" y="7.4" width="11" height="3.2" rx="1"/><path d="M4 13.2h8"/>',
      appearance: '<circle cx="8" cy="8" r="5.6"/><path d="M8 2.4a5.6 5.6 0 0 0 0 11.2z" fill="currentColor"/>',
      services: '<path d="M8 1.8l1.5 4.7 4.7 1.5-4.7 1.5L8 14.2l-1.5-4.7L1.8 8l4.7-1.5z" fill="currentColor"/>',
      modes: '<path d="M8 2l6 3-6 3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/>',
      shortcuts: '<rect x="1.6" y="4" width="12.8" height="8" rx="1.6"/><path d="M4.2 7h.6M7.7 7h.6M11.2 7h.6M5 9.6h6"/>',
      module: '<rect x="2.5" y="2.5" width="4.4" height="4.4" rx="1"/><rect x="9.1" y="2.5" width="4.4" height="4.4" rx="1"/><rect x="2.5" y="9.1" width="4.4" height="4.4" rx="1"/><rect x="9.1" y="9.1" width="4.4" height="4.4" rx="1"/>',
      telegram: '<path d="M14 2.5L1.8 7.3l3.6 1.3 1.3 4 2-2.4 3.1 2.3z"/>',
    };
    const icon = (name) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${icons[name] ?? icons.module}</svg>`;
    // The capsules of «Сервисы AI» (drawn further down): known before the first page opens, since a link can name one.
    const serviceTabs = [["claude", "Claude Code"], ["codex", "Codex"], ["gemini", "Gemini"], ["copilot", "Copilot"], ["cursor", "Cursor"], ["other", t("Другие")]];
    const servicesPage = document.getElementById("page-services");
    let service = (() => { try { return localStorage.getItem("settingsService"); } catch { return null; } })();
    if (!serviceTabs.some(([id]) => id === service)) service = "claude";
    const pages = new Map([
      ["general", { title: t("Основные"), subtitle: t("Запуск, уведомления, Telegram и обновления") }],
      ["show", { title: t("Что показывать"), subtitle: t("Модули панели и их настройки") }],
      ["appearance", { title: t("Внешний вид"), subtitle: t("Тема, размер текста и значок в трее") }],
      ["services", { title: t("Сервисы AI"), subtitle: t("Агенты, лимиты, ключи API и hooks") }],
      ["modes", { title: t("Профили"), subtitle: t("Наборы проектов, модулей и команд") }],
      ["shortcuts", { title: t("Клавиши"), subtitle: t("Все сочетания клавиш в одном месте") }],
      ["telegram", { title: "Telegram", subtitle: t("Уведомления в Telegram"), parent: "general" }],
    ]);
    const areas = [...pages.keys()].filter((id) => !pages.get(id).parent);
    // A module's name and what it does are the texts of its row in «Что показывать».
    for (const row of document.querySelectorAll(".show-open")) {
      pages.set(row.dataset.open, { title: row.querySelector("strong").textContent, subtitle: row.querySelector(".secondary").textContent, parent: "show" });
      row.nextElementSibling.setAttribute("aria-label", row.querySelector("strong").textContent);
    }
    const pageElement = (id) => document.getElementById("page-" + id);
    // Names the Mac's links use, and the sections this window had before the sidebar.
    const aliases = { modules: "show", panel: "show", profiles: "modes", hooks: "services", updates: "general", keys: "shortcuts" };
    const known = (id) => (pages.has(id) ? id : pages.has(aliases[id]) ? aliases[id] : null);
    const remembered = () => { try { return localStorage.getItem("settingsPage"); } catch { return null; } };
    const nav = document.getElementById("settings-nav");
    const search = document.getElementById("settings-search");
    const paneSwitch = document.getElementById("pane-switch");
    const back = document.getElementById("pane-back");
    let current = null;
    function showNav() {
      const query = search.value.trim().toLocaleLowerCase();
      const found = (id) => !query || (pages.get(id).title + " " + pages.get(id).subtitle + " " + pageElement(id).textContent).toLocaleLowerCase().includes(query);
      // A search finds any page: the modules and «Telegram» get rows of their own under the areas.
      const rows = areas.filter(found);
      const inner = query ? [...pages.keys()].filter((id) => pages.get(id).parent && found(id)) : [];
      const chosen = query ? current : pages.get(current)?.parent ?? current;
      const row = (id) => {
        const button = document.createElement("button");
        button.className = "nav-row";
        button.dataset.page = id;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", String(id === chosen));
        button.tabIndex = id === chosen ? 0 : -1;
        button.innerHTML = `<span class="pane-icon ${id.startsWith("module.") ? "module" : id}">${icon(id)}</span>`;
        button.append(Object.assign(document.createElement("span"), { className: "name", textContent: pages.get(id).title }));
        button.onclick = () => go(id);
        return button;
      };
      const children = rows.map(row);
      if (inner.length) children.push(Object.assign(document.createElement("h2"), { textContent: t("Модули") }), ...inner.map(row));
      nav.replaceChildren(...children);
      if (!nav.querySelector('[tabindex="0"]') && nav.querySelector(".nav-row")) nav.querySelector(".nav-row").tabIndex = 0;
      document.getElementById("settings-nothing").hidden = children.length > 0;
    }
    function go(id, focus) {
      // «service.codex», the Mac's link to a service's page: «Сервисы AI» on that capsule.
      if (id?.startsWith?.("service.")) { chooseService(id.slice(8)); id = "services"; }
      id = known(id) ?? "general";
      // «Telegram» where the app can't offer it has no page either.
      if (id === "telegram" && document.getElementById("telegram").hidden) id = "general";
      const from = current;
      current = id;
      try { localStorage.setItem("settingsPage", id); } catch { /* the page is just not remembered */ }
      for (const page of document.querySelectorAll(".page")) page.hidden = page !== pageElement(id);
      const page = pages.get(id);
      document.getElementById("pane-title").textContent = page.title;
      document.getElementById("pane-subtitle").textContent = page.subtitle;
      const tile = document.getElementById("pane-icon");
      tile.className = "pane-icon " + (id.startsWith("module.") ? "module" : id);
      tile.innerHTML = icon(id);
      back.hidden = !page.parent;
      if (page.parent) back.title = t("Назад: %@", pages.get(page.parent).title) + " (Alt+←)";
      back.setAttribute("aria-label", back.title);
      back.onclick = () => go(page.parent, "row");
      showSwitch();
      showNav();
      document.getElementById("settings-main").scrollTop = 0;
      if (focus === "back") back.focus();
      // Back where the page was opened from: the row that led to it.
      if (focus === "row") (pageElement(id).querySelector(`[data-open="${from}"]`) ?? nav.querySelector('[aria-selected="true"]'))?.focus();
    }
    // A module's main switch in the header stands for its switch in «Что показывать».
    const moduleSwitch = () => document.getElementById(pageElement(current)?.dataset.switch ?? "");
    function showSwitch() {
      const real = moduleSwitch();
      paneSwitch.hidden = !real;
      if (!real) return;
      paneSwitch.checked = real.checked;
      paneSwitch.setAttribute("aria-label", pages.get(current).title);
    }
    paneSwitch.onchange = () => {
      const real = moduleSwitch();
      real.checked = paneSwitch.checked;
      real.dispatchEvent(new Event("change"));
    };
    // A module's settings appear and go with its switch: that is when the header's copy is read again.
    for (const page of document.querySelectorAll(".page[data-switch]")) {
      new MutationObserver(showSwitch).observe(page.firstElementChild, { attributes: true, attributeFilter: ["hidden"] });
    }
    for (const opener of document.querySelectorAll("[data-open]")) opener.onclick = () => go(opener.dataset.open, "back");
    search.oninput = showNav;
    search.onkeydown = (event) => {
      if (event.key === "Escape" && search.value) { search.value = ""; showNav(); }
      if (event.key === "ArrowDown") { event.preventDefault(); nav.querySelector(".nav-row")?.focus(); }
      if (event.key === "Enter") nav.querySelector(".nav-row")?.click();
    };
    // The sidebar from the keyboard: ↑ and ↓ choose a row as they move, Home and End the first and the last.
    nav.onkeydown = (event) => {
      const rows = [...nav.querySelectorAll(".nav-row")];
      const index = rows.indexOf(document.activeElement);
      const next = { ArrowDown: index + 1, ArrowUp: index - 1, Home: 0, End: rows.length - 1 }[event.key];
      if (next === undefined || index < 0) return;
      event.preventDefault();
      if (next < 0) return search.focus();
      const target = rows[Math.min(next, rows.length - 1)].dataset.page;
      go(target);
      nav.querySelector(`[data-page="${target}"]`)?.focus();
    };
    window.addEventListener("keydown", (event) => {
      if (event.altKey && event.key === "ArrowLeft" && !back.hidden) { event.preventDefault(); back.click(); }
      if (event.ctrlKey && event.key.toLowerCase() === "f") { event.preventDefault(); search.focus(); search.select(); }
    });
    // The page asked for by whoever opened the window (the panel's «hooks», a price in «История расхода»), else the
    // one in the address, else the last one looked at.
    go((await invoke("take_settings_page")) ?? (decodeURIComponent(location.hash.slice(1)) || remembered()));
    window.__TAURI__.event.listen("settings-page", (event) => go(event.payload));

    const select = document.getElementById("language");
    const system = new Option(t("Как в системе"), "");
    select.add(system);
    for (const language of ui.languages) select.add(new Option(language.name, language.code));
    select.value = ui.chosen ?? "";
    // The windows reload in the new language; the tray menu follows at once too.
    select.onchange = () => invoke("set_language", { code: select.value || null });

    function showHooks(state) {
      document.getElementById("hooks-status").textContent = state.title;
      document.getElementById("hooks-status").closest("section").toggleAttribute("data-works", state.status !== "notInstalled");
      document.getElementById("hooks-path").textContent = state.settingsPath;
      const install = document.getElementById("hooks-install");
      install.textContent = state.status === "outdated" ? t("Обновить hooks") : t("Установить hooks");
      install.hidden = state.status === "installed";
      install.disabled = !state.mayInstall;
      const remove = document.getElementById("hooks-remove");
      remove.hidden = state.status === "notInstalled";
      remove.disabled = !state.mayInstall;
      const error = document.getElementById("hooks-error");
      error.hidden = !state.error;
      error.textContent = state.error ?? "";
    }
    showHooks(await invoke("hooks_state"));
    document.getElementById("hooks-install").onclick = async () => showHooks(await invoke("install_hooks"));
    document.getElementById("hooks-remove").onclick = async () => showHooks(await invoke("uninstall_hooks"));

    // Codex and Copilot: the same hook with --agent, in their own files.
    for (const card of document.querySelectorAll(".agent-hooks")) {
      const agent = card.dataset.agent;
      const show = (state) => {
        card.querySelector(".status").textContent = state.title;
        card.querySelector(".path").textContent = state.settingsPath;
        card.toggleAttribute("data-works", state.status !== "notInstalled");
        const install = card.querySelector(".install");
        install.textContent = state.status === "outdated" ? t("Обновить hooks") : t("Установить hooks");
        install.hidden = state.status === "installed";
        install.disabled = !state.mayInstall;
        const remove = card.querySelector(".remove");
        remove.hidden = state.status === "notInstalled";
        remove.disabled = !state.mayInstall;
        const note = card.querySelector(".note");
        if (note) {
          note.hidden = !state.note;
          note.textContent = state.note ?? "";
        }
        const error = card.querySelector(".error");
        error.hidden = !state.error;
        error.textContent = state.error ?? "";
      };
      show(await invoke("agent_hooks_state", { agent }));
      card.addEventListener("refresh", async () => show(await invoke("agent_hooks_state", { agent })));
      card.querySelector(".install").onclick = async () => show(await invoke("install_agent_hooks", { agent }));
      card.querySelector(".remove").onclick = async () => show(await invoke("uninstall_agent_hooks", { agent }));
    }

    // Where the current profile runs Claude's commands, and how long a background run may take (for all profiles).
    const launch = await invoke("launch_settings");
    const mode = document.getElementById("launch-mode");
    for (const [value, title] of [["", t("Спрашивать")], ["terminal", t("Терминал")], ["background", t("Фон")]]) mode.add(new Option(title, value));
    mode.value = launch.mode ?? "";
    const limit = document.getElementById("time-limit");
    for (const minutes of [30, 60, 90, 120, 180, 240]) limit.add(new Option(t("%lld мин", minutes), String(minutes)));
    if (![...limit.options].some((o) => o.value === String(launch.timeLimitMinutes))) {
      limit.add(new Option(t("%lld мин", launch.timeLimitMinutes), String(launch.timeLimitMinutes)));
    }
    limit.value = String(launch.timeLimitMinutes);
    // «Ночные задачи начинаются в»: when «На ночь» runs start.
    const nightHour = document.getElementById("night-hour");
    invoke("night_hour").then((view) => nightHour.replaceChildren(...view.hours.map(([hour, title]) => new Option(title, hour, false, hour === view.hour))));
    nightHour.onchange = () => invoke("set_night_hour", { hour: Number(nightHour.value) });
    const saveLaunch = () => invoke("set_launch_settings", { mode: mode.value || null, timeLimitMinutes: Number(limit.value) });
    mode.onchange = saveLaunch;
    limit.onchange = saveLaunch;

    // A profile with folder projects: whose dates go to «Ближайшее» and the reminders.
    const profileCalendar = document.getElementById("profile-calendar");
    for (const [value, title] of [["off", t("Выключен")], ["dates", t("Дедлайны и публикации")], ["contentPlan", t("+ контент-план")]]) profileCalendar.add(new Option(title, value));
    profileCalendar.onchange = () => invoke("set_profile_calendar", { mode: profileCalendar.value });
    const reminders = document.getElementById("reminders");
    const reminderChoices = [[[], t("не напоминать")], [[2], t("за 2 часа")], [[24], t("за сутки")], [[24, 2], t("за сутки и за 2 часа")], [[72, 24], t("за 3 дня и за сутки")]];
    for (const [hours, title] of reminderChoices) reminders.add(new Option(title, JSON.stringify(hours)));
    const savedHours = JSON.stringify([...await invoke("reminder_hours")].sort((a, b) => b - a));
    if (![...reminders.options].some((o) => o.value === savedHours)) reminders.add(new Option(savedHours, savedHours));
    reminders.value = savedHours;
    reminders.onchange = () => invoke("set_reminder_hours", { hours: JSON.parse(reminders.value) });

    // The current profile's git projects folder; a new one makes installed hooks outdated, so they are shown anew.
    function showFolder(folder) {
      document.getElementById("current-profile").textContent = t("Текущий профиль") + ": " + folder.profile;
      document.getElementById("projects-folder-path").textContent = folder.path ?? "";
      document.getElementById("projects-folder-choose").hidden = folder.path === null;
      document.getElementById("projects-folder-reset").hidden = !folder.custom;
      document.getElementById("calendar-row").hidden = folder.calendar === null;
      if (folder.calendar !== null) document.getElementById("profile-calendar").value = folder.calendar;
      const note = document.getElementById("projects-folder-note");
      note.hidden = !folder.note;
      note.textContent = folder.note ?? "";
      // A profile without git projects isn't a mistake; a folder that is gone is.
      note.className = folder.path === null ? "secondary" : "error";
    }
    // The current profile's service, rights, stages, metrics and commands (the Mac's profile page). Each field is
    // written when it is left, so typing isn't interrupted; the panel reads the profile again.
    let details = null;
    const openCommands = new Set();
    const setField = (field, value) => invoke("set_profile_field", { field, value });
    const metricTitles = [["words", t("Слова")], ["duration", t("Хронометраж")], ["readingTime", t("Время чтения")], ["pages", t("Страницы")], ["sources", t("Источники")], ["deadline", t("Дедлайн")], ["publishDate", t("Дата публикации")], ["lastActivity", t("Последняя правка")]];
    const profileService = document.getElementById("profile-service");
    const profilePermissions = document.getElementById("profile-permissions");
    for (const [value, title] of [["code", t("Код: git, сборки, PR")], ["filesOnly", t("Только файлы проекта")], ["filesAndWeb", t("Файлы + поиск в интернете")]]) profilePermissions.add(new Option(title, value));
    const serviceOptions = (select, first, chosen) => {
      select.replaceChildren(new Option(first, ""), ...details.services.filter((s) => s.id !== "claude-code").map((s) => new Option(s.name, s.id)));
      if (chosen && ![...select.options].some((o) => o.value === chosen)) select.add(new Option(chosen, chosen));
      select.value = chosen ?? "";
    };
    function showGoal() {

    function commandEditor(command) {
      const item = document.createElement("details");
      item.className = "command-editor";
      item.open = openCommands.has(command.id);
      item.ontoggle = () => { if (item.open) openCommands.add(command.id); else openCommands.delete(command.id); };
      const summary = document.createElement("summary");
      summary.textContent = command.title || t("Новая команда");
      const store = () => setField("commands", details.commands);
      const field = (label, input) => {
        const row = document.createElement("label");
        row.className = "row";
        row.append(Object.assign(document.createElement("span"), { textContent: label }), input);
        return row;
      };
      const text = (key, placeholder) => {
        const input = Object.assign(document.createElement("input"), { type: "text", value: command[key] ?? "", placeholder: placeholder ?? "" });
        input.className = "wide";
        input.onchange = () => {
          command[key] = input.value;
          if (key === "title") summary.textContent = input.value || t("Новая команда");
          store();
        };
        return input;
      };
      const input = document.createElement("select");
      input.add(new Option(t("Главный файл"), "mainFile"));
      input.add(new Option(t("Весь проект"), "project"));
      input.value = command.input === "project" ? "project" : "mainFile";
      input.onchange = () => { command.input = input.value; store(); };
      const service = document.createElement("select");
      serviceOptions(service, t("Сервис профиля"), command.service);
      service.onchange = () => { command.service = service.value || null; store(); };
      const task = Object.assign(document.createElement("textarea"), { value: command.task ?? "", rows: 4 });
      task.setAttribute("aria-label", t("Задача"));
      task.onchange = () => { command.task = task.value; store(); };
      const remove = Object.assign(document.createElement("button"), { textContent: t("Удалить команду") });
      remove.onclick = async () => {
        if (!remove.dataset.asked) { remove.dataset.asked = "1"; remove.textContent = t("Удалить?"); return; }
        details.commands = details.commands.filter((c) => c !== command);
        await store();
        showCommands();
      };
      item.append(summary,
        field(t("Название"), text("title")),
        field(t("Файл результата"), text("output", t("хуки.md"))),
        field(t("На чём"), input),
        field(t("Спросить перед запуском"), text("asks", t("пусто — запускать сразу; «Язык», «Тон»…"))),
        field(t("Сервис"), service),
        Object.assign(document.createElement("span"), { className: "secondary", textContent: t("Задача") }),
        task, remove);
      return item;
    }
    function showCommands() {

      serviceOptions(profileService, "Claude Code", details.service);

      document.getElementById("profile-stages").value = details.stages.join(", ");
      document.getElementById("profile-metrics").replaceChildren(...metricTitles.map(([key, title]) => {

        const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: details.metrics.includes(key) });
        box.onchange = () => {
          details.metrics = metricTitles.map(([k]) => k).filter((k) => (k === key ? box.checked : details.metrics.includes(k)));

    document.getElementById("command-add").onclick = async () => {

    // «Расход по API»: today and this month, the budget, a price per provider (written when a field is left).

    budget.onchange = async () => showSpendLines(await invoke("set_api_budget", { budget: number(budget) }));
    // «Сервисы AI» by service, as on the Mac: a capsule per service with a dot (green — something of it works here),
    // and only that service's blocks and rows below. Rows of the lists are marked as they are built.
    function markService(element, id, works) {
      element.dataset.service = serviceTabs.some(([known]) => known === id) ? id : "other";
      if (works) element.dataset.works = "1";
    }
    const ofService = (element, id) => element.dataset.service.split(" ").includes(id);
    function showService() {
      for (const element of servicesPage.querySelectorAll("[data-service]")) element.classList.toggle("service-off", !ofService(element, service));
      // A block whose rows all belong to other services goes with them.
      for (const card of servicesPage.querySelectorAll("section.card:not([data-service])")) {
        const marked = [...card.querySelectorAll("[data-service]")];
        card.classList.toggle("service-off", marked.length > 0 && marked.every((element) => element.classList.contains("service-off")));
      }
      document.getElementById("service-tabs").replaceChildren(...serviceTabs.map(([id, title]) => {
        const tab = document.createElement("button");
        tab.className = "service-tab";
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(id === service));
        const works = [...servicesPage.querySelectorAll("[data-works]")].some((element) => ofService(element, id));
        tab.append(Object.assign(document.createElement("span"), { className: works ? "dot works" : "dot" }), title);
        tab.onclick = () => chooseService(id);
        return tab;
      }));
    }
    // The lists are filled later and again after every change; so are the marks of installed hooks.
    const serviceObserver = new MutationObserver(showService);
    for (const list of ["agent-rows", "hub-sources", "provider-rows"]) serviceObserver.observe(document.getElementById(list), { childList: true });
    serviceObserver.observe(servicesPage, { subtree: true, attributes: true, attributeFilter: ["data-works"] });
    showService();
    function chooseService(id) {
      if (!serviceTabs.some(([known]) => known === id)) return;
      service = id;
      try { localStorage.setItem("settingsService", id); } catch { /* the tab is just not remembered */ }
      showService();
    }

    function showSpendLines(view) {

    function showSpend(view) {
      showSpendLines(view);
      if (document.activeElement !== budget) budget.value = view.budget ?? "";
      // Leaving one price field for the next must not rebuild the rows under the cursor.
      if (document.activeElement?.classList.contains("price")) return;
      document.getElementById("price-rows").replaceChildren(...view.prices.map((price) => {
        const row = document.createElement("div");

          const input = Object.assign(document.createElement("input"), { type: "number", min: 0, step: "any", value: value ?? "", placeholder: "—" });
          input.className = "price";
          input.setAttribute("aria-label", label);
          return input;
        };
        const input = field(price.input, price.label);
        const output = field(price.output, price.label);

        input.onchange = store;
        output.onchange = store;
        const pair = document.createElement("span");
        pair.append(input, " / ", output);

    function showServices(view) {
      document.getElementById("no-key-store").hidden = view.keysAvailable;

      providerRows.replaceChildren(...view.providers.map((provider) => {
        const box = document.createElement("div");

        markService(box, { anthropic: "claude", openai: "codex", google: "gemini" }[provider.id] ?? "other", provider.ok);
        const head = document.createElement("div");
        head.className = "row";
        const title = document.createElement("span");
        title.textContent = provider.id === "compatible" && view.compatibleName ? view.compatibleName : provider.title;
        const status = document.createElement("span");
        status.className = provider.ok ? "status ok" : provider.status ? "status warn" : "status secondary";
        status.textContent = provider.status ?? (provider.hasKey ? t("Ключ сохранён") : provider.keyRequired ? t("Нет ключа") : "");
        head.append(title, status);
        box.append(head);
        if (provider.id === "compatible") {
          const form = document.createElement("div");
          form.className = "key-form";
          const name = Object.assign(document.createElement("input"), { type: "text", value: view.compatibleName, placeholder: "Ollama, LM Studio, OpenRouter…" });
          name.setAttribute("aria-label", t("Название"));
          const url = Object.assign(document.createElement("input"), { type: "text", value: view.compatibleUrl });
          url.setAttribute("aria-label", t("Адрес"));
          const store = async () => showServices(await invoke("set_compatible_server", { name: name.value, url: url.value }));
          name.onchange = store;
          url.onchange = store;
          form.append(name, url);
          box.append(form);
        }
        const askKey = view.keysAvailable && (keyForms.has(provider.id) || (provider.keyRequired && !provider.hasKey));
        if (askKey) {
          const form = document.createElement("div");
          form.className = "key-form";
          const key = Object.assign(document.createElement("input"), { type: "password", placeholder: t("Ключ API"), autocomplete: "off" });
          const saveKey = async () => {
            if (!key.value.trim()) return;
            try {
              const next = await invoke("save_api_key", { provider: provider.id, key: key.value });
              keyForms.delete(provider.id);
              providerErrors.delete(provider.id);
              showServices(next);
            } catch (error) {
              providerErrors.set(provider.id, String(error));
              showServices(await invoke("services_view"));
            }
          };
          key.addEventListener("keydown", (event) => { if (event.key === "Enter") saveKey(); });
          const saveButton = Object.assign(document.createElement("button"), { textContent: t("Сохранить"), onclick: saveKey });
          form.append(key, saveButton);
          if (provider.keyPage) {
            const page = Object.assign(document.createElement("button"), { textContent: "↗", title: t("Где взять ключ: %@", provider.keyPage), onclick: () => invoke("open_key_page", { provider: provider.id }) });
            page.setAttribute("aria-label", page.title);
            form.append(page);
          }
          box.append(form);
        }
        const actions = document.createElement("div");
        actions.className = "provider-actions";
        if (provider.hasKey || !provider.keyRequired) {
          const check = Object.assign(document.createElement("button"), { textContent: t("Проверить") });
          check.onclick = async () => {
            check.disabled = true;
            showServices(await invoke("check_api", { provider: provider.id }));
          };
          actions.append(check);
        }
        if (provider.hasKey) {
          actions.append(Object.assign(document.createElement("button"), {
            textContent: keyForms.has(provider.id) ? t("Отмена") : t("Заменить ключ"),
            onclick: async () => { if (keyForms.has(provider.id)) keyForms.delete(provider.id); else keyForms.add(provider.id); showServices(await invoke("services_view")); },
          }));
          const remove = Object.assign(document.createElement("button"), { textContent: deleting.has(provider.id) ? t("Удалить?") : t("Удалить ключ") });
          remove.onclick = async () => {
            if (!deleting.has(provider.id)) { deleting.add(provider.id); return showServices(await invoke("services_view")); }
            deleting.delete(provider.id);
            showServices(await invoke("delete_api_key", { provider: provider.id }));
          };
          actions.append(remove);
        } else if (!provider.keyRequired && view.keysAvailable && !keyForms.has(provider.id)) {
          actions.append(Object.assign(document.createElement("button"), {
            textContent: t("Ключ (если нужен)"),
            onclick: async () => { keyForms.add(provider.id); showServices(await invoke("services_view")); },
          }));
        }
        if (provider.models.length) {
          const model = document.createElement("select");
          model.setAttribute("aria-label", t("Модель"));
          for (const id of provider.models) model.add(new Option(id, id, false, id === provider.model));

          actions.append(model);
        } else if (provider.model) {
          actions.append(Object.assign(document.createElement("span"), { className: "secondary", textContent: provider.model }));
        }
        if (actions.childElementCount) box.append(actions);
        if (providerErrors.has(provider.id)) box.append(Object.assign(document.createElement("p"), { className: "error", textContent: providerErrors.get(provider.id) }));
        return box;
      }));
    }

    // (the shortcuts' titles and problems) is taken from the reply. Replacing it lost the next edit in the same form.
    const saveQuick = async () => { quick.hotKeys = (await invoke("set_quick_commands", { commands: quick.commands })).hotKeys; };
    const kinds = [["script", t("Скрипт в фоне")], ["terminal", t("Скрипт в Терминале")], ["open", t("Открыть ссылку, файл или папку")]];
    const placeholder = (kind) => (kind === "open" ? t("https://… или ~/папка") : t("команда, например: winget upgrade --all"));
    function quickEditor(command, index) {
      const box = document.createElement("div");
      box.className = "quick-editor";
      const head = document.createElement("div");
      head.className = "quick-editor-head";
      const symbol = document.createElement("select");
      symbol.title = t("Значок кнопки");
      symbol.setAttribute("aria-label", t("Значок кнопки"));
      for (const [name, glyph] of quick.symbols) symbol.add(new Option(glyph, name));
      symbol.value = command.symbol;
      symbol.onchange = () => { command.symbol = symbol.value; saveQuick(); };
      const title = Object.assign(document.createElement("input"), { type: "text", value: command.title });
      title.setAttribute("aria-label", t("Название"));
      title.onchange = () => { command.title = title.value; saveQuick(); };
      const move = (offset, label, glyph) => {
        const button = Object.assign(document.createElement("button"), { textContent: glyph, title: label, disabled: !quick.commands[index + offset] });
        button.setAttribute("aria-label", label);
        button.onclick = async () => {
          [quick.commands[index], quick.commands[index + offset]] = [quick.commands[index + offset], quick.commands[index]];
          await saveQuick();
          showQuickLibrary();
        };
        return button;
      };
      const remove = Object.assign(document.createElement("button"), { textContent: t("Удалить команду") });
      remove.onclick = async () => {
        if (!remove.dataset.asked) { remove.dataset.asked = "1"; remove.textContent = t("Удалить?"); return; }
        quick.commands.splice(index, 1);
        await saveQuick();
        showQuickLibrary();
      };
      head.append(symbol, title, move(-1, t("Выше"), "↑"), move(1, t("Ниже"), "↓"), remove);
      const kind = document.createElement("select");
      for (const [value, label] of kinds) kind.add(new Option(label, value));
      kind.value = command.kind;
      const value = Object.assign(document.createElement("input"), { type: "text", value: command.value, placeholder: placeholder(command.kind) });
      value.className = "mono";
      value.setAttribute("aria-label", t("Что делает"));
      kind.onchange = () => { command.kind = kind.value; value.placeholder = placeholder(kind.value); saveQuick(); };
      value.onchange = () => { command.value = value.value; saveQuick(); };
      const kindRow = document.createElement("label");
      kindRow.className = "row";
      kindRow.append(Object.assign(document.createElement("span"), { textContent: t("Что делает") }), kind);
      const confirm = Object.assign(document.createElement("input"), { type: "checkbox", checked: command.confirm });
      confirm.onchange = () => { command.confirm = confirm.checked; saveQuick(); };
      const confirmRow = document.createElement("label");
      confirmRow.className = "check-line";
      confirmRow.append(confirm, " ", t("Спрашивать перед запуском"));
      box.append(head, kindRow, value, confirmRow, ...hotKeyRow(command));
      return box;
    }
    // The command's keyboard shortcut: «Записать», then the keys; Esc cancels, ✕ removes it. One recorder at a time.
    // While it records, the app lets go of its own global keys, so a combination already in use reaches this window.
    let stopRecording = null;
    function hotKeyRow(command) {
      const info = quick.hotKeys[command.id];
      const row = document.createElement("div");
      row.className = "row";
      const buttons = document.createElement("span");
      buttons.className = "hot-key";
      const record = document.createElement("button");
      const note = document.createElement("p");
      note.className = "warning";
      const idle = () => {
        record.textContent = info?.title ?? t("Записать");
        record.title = t("Сочетание клавиш запускает команду из любого приложения");
        record.classList.remove("recording");
        note.textContent = info?.problem ?? "";
        note.hidden = !info?.problem;
      };
      record.setAttribute("aria-label", info ? t("Сочетание клавиш: %@", info.title) : t("Сочетание клавиш не задано"));
      const onKey = async (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (event.repeat || ["Control", "Alt", "AltGraph", "Shift", "Meta", "OS"].includes(event.key)) return;
        const held = { ctrl: event.ctrlKey, alt: event.altKey, shift: event.shiftKey, meta: event.metaKey };
        if (event.code === "Escape" && !Object.values(held).some(Boolean)) return stop();
        const pressed = await invoke("hot_key_from_press", { keyCode: event.keyCode, code: event.code, ...held });
        if (pressed.combo) {
          command.hotKey = pressed.combo;
          stop(false);
          await saveQuick();
          showQuickLibrary();
        } else if (pressed.error) {
          note.textContent = pressed.error;
          note.hidden = false;
        }
      };
      const cancel = () => stop();
      function stop(resume = true) {
        if (stopRecording !== cancel) return;
        stopRecording = null;
        window.removeEventListener("keydown", onKey, true);
        window.removeEventListener("blur", cancel);
        window.removeEventListener("pagehide", cancel);
        idle();
        if (resume) invoke("set_hot_key_recording", { on: false });
      }
      record.onclick = async () => {
        if (stopRecording === cancel) return stop();
        stopRecording?.();
        stopRecording = cancel;
        await invoke("set_hot_key_recording", { on: true });
        record.textContent = t("Нажмите сочетание…");
        record.title = t("Нажмите клавиши с Ctrl, Alt или Win; Esc — отменить");
        record.classList.add("recording");
        note.hidden = true;
        window.addEventListener("keydown", onKey, true);
        window.addEventListener("blur", cancel);
        window.addEventListener("pagehide", cancel);
      };
      buttons.append(record);
      if (info) {
        const clear = Object.assign(document.createElement("button"), { textContent: "✕", title: t("Убрать сочетание") });
        clear.setAttribute("aria-label", t("Убрать сочетание"));
        clear.onclick = async () => {
          stopRecording?.();
          delete command.hotKey;
          await saveQuick();
          showQuickLibrary();
        };
        buttons.append(clear);
      }
      row.append(Object.assign(document.createElement("span"), { textContent: t("Сочетание клавиш") }), buttons);
      idle();
      return [row, note];
    }
    function showQuickLibrary() {

    // «Другие AI»: each service's limits — its switch, what it needs, its key, Gemini's plan and quota.
    function showHubSettings(view) {

    window.__TAURI__.event.listen("profiles-changed", showCurrent);

    const prAlerts = document.getElementById("pr-alerts");
    prAlerts.checked = await invoke("pull_request_alerts");
    prAlerts.onchange = () => invoke("set_pull_request_alerts", { enabled: prAlerts.checked });

    // «Telegram»: the person's own bot — the token (kept with the API keys), the chat bound with «Start», a test
    // message, and which of the notifications also go to the chat.
    {
      const id = (name) => document.getElementById("telegram-" + name);
      let error = null;
      const show = (view) => {
        document.getElementById("telegram").hidden = !view.available;
        id("bot").textContent = view.hasToken ? (view.bot ? "@" + view.bot : t("подключаюсь…")) : "";
        id("token").hidden = id("save").hidden = view.hasToken;
        id("remove").hidden = !view.hasToken;
        const waiting = view.bindingCode != null;
        id("chat").textContent = waiting ? t("Жду «Start» в Telegram (код %@)…", view.bindingCode) : (view.chat ?? "");
        id("cancel").hidden = !waiting;
        id("unbind").hidden = waiting || !view.chat;
        id("bind").hidden = waiting || !view.hasToken;
        // Another program reads the bot: «Start» can't reach this one, so the chat's id is typed.
        const byHand = view.conflict && !waiting && !view.chat;
        id("chat-id").hidden = id("chat-save").hidden = !byHand;
        id("chat-id").placeholder = t("ID чата");
        id("status").textContent = error ?? view.status ?? "";
        id("test").disabled = !view.hasToken || !view.chat;
        id("answers").checked = view.answers;
        id("requests").checked = view.requests;
        id("reading").textContent = !view.answers || !view.hasToken || !view.chat ? "" : view.conflict ? t("Бота читает другой Mac") : view.reading ? t("Отвечает") : t("Не отвечает");
        id("events").replaceChildren(...view.events.map((event) => {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("label");
          label.textContent = event.title;
          label.htmlFor = "telegram-event-" + event.id;
          const box = document.createElement("input");
          box.type = "checkbox";
          box.id = label.htmlFor;
          box.checked = event.on;
          box.onchange = async () => show(await invoke("set_telegram_event", { event: event.id, on: box.checked }));
          row.append(label, box);
          return row;
        }));
      };
      const act = (button, command, args) => async () => {
        button.disabled = true;
        error = null;
        try {
          show(await invoke(command, args?.()));
        } catch (problem) {
          error = String(problem);
          show(await invoke("telegram_view"));
        }
        button.disabled = false;
      };
      id("save").onclick = act(id("save"), "telegram_save_token", () => { const token = id("token").value; id("token").value = ""; return { token }; });
      id("remove").onclick = act(id("remove"), "telegram_remove_token");
      id("bind").onclick = act(id("bind"), "telegram_bind");
      id("cancel").onclick = act(id("cancel"), "telegram_cancel_binding");
      id("unbind").onclick = act(id("unbind"), "telegram_set_chat", () => ({ chat: null }));
      id("chat-save").onclick = act(id("chat-save"), "telegram_set_chat", () => ({ chat: id("chat-id").value }));
      id("test").onclick = act(id("test"), "telegram_test");
      id("answers").onchange = async () => show(await invoke("set_telegram_answers", { on: id("answers").checked }));
      id("requests").onchange = async () => show(await invoke("set_telegram_requests", { on: id("requests").checked }));
      show(await invoke("telegram_view"));
      window.__TAURI__.event.listen("telegram-changed", async () => show(await invoke("telegram_view")));
    }

    // «Обновления» (Windows): a check once a day and by hand; the new version is installed only on a click.
    {
      const state = document.getElementById("updates-state");
      const install = document.getElementById("updates-install");
      const check = document.getElementById("updates-check");
      const daily = document.getElementById("updates-daily");
      const show = (available, text) => {
        state.textContent = text ?? (available ? t("Доступна версия %@", available) : t("Версия %@", ui.version));
        install.hidden = !available;
      };
      const view = await invoke("updates_view");
      document.getElementById("updates").hidden = !view.supported;
      daily.checked = view.daily;
      daily.onchange = () => invoke("set_updates_daily", { enabled: daily.checked });
      show(view.available);
      check.onclick = async () => {
        check.disabled = true;
        try {
          const available = await invoke("check_updates");
          show(available, available ? undefined : t("Установлена последняя версия"));
        } catch (error) {
          show(null, t("Не удалось проверить обновления: %@", String(error)));
        }
        check.disabled = false;
      };
      install.onclick = async () => {
        install.disabled = check.disabled = true;
        state.textContent = t("Загрузка обновления…");
        try {
          await invoke("install_update");
          show((await invoke("updates_view")).available);
        } catch (error) {
          show((await invoke("updates_view")).available, t("Не удалось установить обновление: %@", String(error)));
        }
        install.disabled = check.disabled = false;
      };
      window.__TAURI__.event.listen("updates-changed", async () => show((await invoke("updates_view")).available));
    }

    const autostart = document.getElementById("autostart");
    autostart.checked = await invoke("autostart_enabled");
    autostart.onchange = async () => {
      autostart.checked = await invoke("set_autostart", { enabled: autostart.checked });
    };
  </script>
</body>
</html>
