[package]
name = "claudepult-core"
description = "AI Hub Bar shared logic: paths, settings, languages, the link to the running app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
interprocess.workspace = true
sys-locale.workspace = true
chrono.workspace = true
httpdate = "1"
ureq = "3"
regex = "1"
unicode-segmentation = "1"
# Unzips a .docx for its word count; already built for Tauri, so nothing new is downloaded.
miniz_oxide = { version = "0.8", features = ["with-alloc"] }
# «Ресурсы компьютера»: processor, memory, disks, network and processes on every system. Pinned: 0.40.1 was three
# weeks old when added (2026-11-18).
sysinfo = { version = "=0.40.1", default-features = false, features = ["system", "disk", "network", "gpu"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_DataExchange"] }
